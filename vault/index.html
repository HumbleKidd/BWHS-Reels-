<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff3d6e" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Stage" />
<link rel="manifest" href="/vault/manifest.webmanifest" />
<link rel="icon" href="/icon-192.png" />
<title>Stage</title>
<!-- isolated portal, skip reels-boot.js injection -->
<style>
#vxApp, #vxApp * { box-sizing: border-box; }
#vxApp { min-height: 100dvh; margin: 0; background:
  radial-gradient(900px 420px at 8% -10%, #ffd0e2 0%, transparent 55%),
  radial-gradient(800px 480px at 100% 0%, #c9dcff 0%, transparent 50%),
  linear-gradient(180deg, #fff8f3 0%, #fff1e6 40%, #eef5ff 100%);
  color: #1c1430; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
#vxApp button, #vxApp input, #vxApp select { font: inherit; color: inherit; }
#vxApp button { cursor: pointer; }
#vxApp img { display: block; max-width: 100%; }
#vxTop { position: sticky; top: 0; z-index: 20; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: rgba(255,248,243,.9); backdrop-filter: blur(12px); border-bottom: 1px solid #ffd8c6; }
#vxBrand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#vxBrand b { font-size: 22px; letter-spacing: -0.04em; }
#vxBrand b i { font-style: normal; color: #ff3d6e; }
#vxSearch { display: flex; gap: 8px; margin-top: 10px; }
#vxSearch input { flex: 1; height: 46px; border-radius: 14px; border: 1px solid #ffd0bc; background: #fff; padding: 0 14px; outline: none; }
#vxSearch button, #vxLanes button, #vxDock button, #vxPlay, #vxEpisodes button, #vxServers button { border: 0; }
#vxMic, #vxSync { width: 46px; height: 46px; border-radius: 14px; background: #2f6bff; color: #fff; display: grid; place-items: center; }
#vxLanes { display: flex; gap: 8px; overflow: auto; margin-top: 10px; padding-bottom: 2px; }
#vxLanes button { height: 34px; padding: 0 12px; border-radius: 999px; background: #fff; border: 1px solid #ffd0bc; color: #6b5878; font-weight: 700; font-size: 13px; white-space: nowrap; }
#vxLanes button.on { background: #ff3d6e; color: #fff; border-color: transparent; }
#vxMain { width: min(1180px, 100%); margin: 0 auto; padding: 12px 12px 28px; }
#vxStage { background: #fff; border-radius: 28px; padding: 10px; box-shadow: 0 18px 50px rgba(255, 80, 120, .16); border: 1px solid #ffe0d2; }
#vxScreen { position: relative; width: 100%; aspect-ratio: 16/9; min-height: 42dvh; border-radius: 22px; overflow: hidden; background: #1b1230; }
#vxFrame, #vxScreen video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #120c22; }
#vxPoster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#vxVeil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(28,20,48,.45), transparent 46%); pointer-events: none; }
#vxPlay { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5; width: 74px; height: 74px; border-radius: 50%; background: #ff3d6e; color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(255,61,110,.45); }
#vxPlay:focus, #vxDock button:focus, #vxLanes button:focus, #vxShelf button:focus, #vxEpisodes button:focus, #vxServers button:focus, #vxSearch input:focus, #vxMic:focus, #vxSync:focus { outline: 3px solid #2f6bff; outline-offset: 2px; }
#vxCenter { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 4; }
#vxCenter span { width: 92px; height: 92px; border-radius: 50%; background: rgba(255,255,255,.92); color: #ff3d6e; display: grid; place-items: center; }
#vxApp.playing #vxCenter { display: none; }
#vxApp.playing #vxPoster { display: none; }
#vxTitleRow { display: flex; justify-content: space-between; gap: 10px; align-items: end; padding: 10px 6px 4px; }
#vxTitleRow h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
#vxTitleRow p { margin: 4px 0 0; color: #6b5878; font-size: 13px; }
#vxDock { display: grid; gap: 8px; padding: 4px 4px 8px; }
#vxSeek { width: 100%; accent-color: #ff3d6e; height: 28px; }
#vxRow { display: flex; flex-wrap: wrap; gap: 8px; }
#vxDock button, #vxServers button, #vxEpisodes button { height: 42px; padding: 0 12px; border-radius: 12px; background: #fff4ec; border: 1px solid #ffd7c4; font-weight: 800; font-size: 13px; }
#vxDock button.on, #vxServers button.on, #vxEpisodes button.on { background: #2f6bff; color: #fff; border-color: transparent; }
#vxServers, #vxEpisodes, #vxCast { display: flex; gap: 8px; overflow: auto; padding-bottom: 2px; }
#vxShelf { margin-top: 16px; }
#vxShelf h3 { margin: 0 0 10px; font-size: 18px; }
#vxGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
#vxGrid button { text-align: left; background: #fff; border: 1px solid #ffe0d2; border-radius: 16px; padding: 0 0 8px; overflow: hidden; }
#vxGrid img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #ffe8dc; }
#vxGrid strong { display: block; padding: 8px 8px 0; font-size: 13px; line-height: 1.25; }
#vxGrid em { display: block; padding: 2px 8px 0; font-style: normal; color: #6b5878; font-size: 12px; }
#vxStatus { min-height: 22px; color: #6b5878; font-size: 13px; padding: 4px 2px 0; }
#vxSyncBox { display: none; margin-top: 8px; background: #fff; border: 1px solid #ffd7c4; border-radius: 16px; padding: 10px; }
#vxSyncBox.open { display: grid; grid-template-columns: 132px 1fr; gap: 10px; align-items: center; }
#vxSyncBox canvas { width: 132px; height: 132px; background: #fff; border-radius: 10px; }
#vxSyncBox small { color: #6b5878; word-break: break-all; }
@media (min-width: 900px) {
  #vxScreen { min-height: 62dvh; }
  #vxPlay { width: 84px; height: 84px; }
}
</style>
</head>
<body>
<div id="vxApp">
  <header id="vxTop">
    <div id="vxBrand">
      <b>BWHS <i>Stage</i></b>
      <button id="vxSync" type="button" data-dpad aria-label="Sync this film">Sync</button>
    </div>
    <div id="vxSearch">
      <input id="vxQ" data-dpad type="search" placeholder="Search films and shows" aria-label="Search films and shows" />
      <button id="vxMic" type="button" data-dpad aria-label="Voice search">Mic</button>
    </div>
    <div id="vxLanes" id="lanes"></div>
    <div id="vxSyncBox"><canvas id="vxQr" width="132" height="132"></canvas><div><strong>Open this film on another screen</strong><br /><small id="vxLink"></small><br /><button id="vxCopy" type="button" data-dpad>Copy link</button></div></div>
  </header>
  <main id="vxMain">
    <section id="vxStage" aria-label="Video playback">
      <div id="vxScreen" data-dpad tabindex="0" aria-label="Playback screen">
        <img id="vxPoster" alt="" />
        <div id="vxVeil"></div>
        <div id="vxCenter"><span id="vxCenterIcon"></span></div>
        <button id="vxPlay" type="button" data-dpad aria-label="Play pause">Play</button>
      </div>
      <div id="vxTitleRow">
        <div>
          <h2 id="vxName">Pick a film</h2>
          <p id="vxMeta">Play sits on the screen. Seek, servers, and episodes sit under it.</p>
        </div>
      </div>
      <div id="vxDock" aria-label="Player controls">
        <input id="vxSeek" data-dpad type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <div id="vxRow">
          <button type="button" data-dpad id="vxBack10" aria-label="Back ten seconds">Back 10</button>
          <button type="button" data-dpad id="vxFwd10" aria-label="Forward ten seconds">Forward 10</button>
          <button type="button" data-dpad id="vxPrev" aria-label="Previous">Previous</button>
          <button type="button" data-dpad id="vxNext" aria-label="Next">Next</button>
          <button type="button" data-dpad id="vxMute" aria-label="Mute">Mute</button>
          <button type="button" data-dpad id="vxFull" aria-label="Fullscreen">Fullscreen</button>
          <button type="button" data-dpad id="vxTrailer" aria-label="Trailer">Trailer</button>
          <button type="button" data-dpad id="vxSave" aria-label="Save">Save</button>
        </div>
        <div id="vxRow">
          <label>Sound <input id="vxVol" data-dpad type="range" min="0" max="100" value="100" aria-label="Volume" /></label>
          <label>Light <input id="vxBright" data-dpad type="range" min="70" max="140" value="100" aria-label="Brightness" /></label>
          <button type="button" data-dpad id="vxSpeed" aria-label="Speed">Speed 1x</button>
          <button type="button" data-dpad id="vxRestart" aria-label="Restart">Restart</button>
        </div>
        <div id="vxServers"></div>
        <div id="vxEpisodes"></div>
      </div>
      <div id="vxStatus"></div>
    </section>
    <section id="vxShelf">
      <h3 id="vxShelfTitle">Trending films</h3>
      <div id="vxCast"></div>
      <div id="vxGrid"></div>
    </section>
  </main>
</div>
<script>
(function () {
  var KEY = "129637a8869a61522af21b80f6eb5129";
  var TMDB = "https://api.themoviedb.org/3";
  var IMG = "https://image.tmdb.org/t/p/w500";
  var app = document.getElementById("vxApp");
  var state = {
    lane: "trending",
    items: [],
    current: null,
    detail: null,
    season: 1,
    episode: 1,
    episodes: [],
    server: localStorage.getItem("vx-server") || "videasy",
    playing: false,
    mode: "film",
    elapsed: 0,
    tick: 0,
    duration: 7200,
    muted: localStorage.getItem("vx-mute") === "1",
    volume: Number(localStorage.getItem("vx-vol") || 100),
    speed: 1,
    trailerKey: "",
    saved: JSON.parse(localStorage.getItem("vx-saved") || "[]")
  };
  var servers = {
    vixsrc: { label: "VixSrc", movie: function (id) { return "https://vixsrc.to/movie/" + id + "?autoplay=1"; }, tv: function (id, s, e) { return "https://vixsrc.to/tv/" + id + "/" + s + "/" + e + "?autoplay=1"; } },
    videasy: { label: "Videasy", movie: function (id) { return "https://player.videasy.net/movie/" + id + "?autoplay=true&nextButton=false"; }, tv: function (id, s, e) { return "https://player.videasy.net/tv/" + id + "/" + s + "/" + e + "?autoplay=true&nextButton=false"; } },
    vidlink: { label: "VidLink", movie: function (id) { return "https://vidlink.pro/movie/" + id + "?primaryColor=ff3d6e&autoplay=true&next=0"; }, tv: function (id, s, e) { return "https://vidlink.pro/tv/" + id + "/" + s + "/" + e + "?primaryColor=ff3d6e&autoplay=true&next=0"; } },
    vidsrc: { label: "VidSrc", movie: function (id) { return "https://vidsrc.xyz/embed/movie?tmdb=" + id + "&autoplay=1"; }, tv: function (id, s, e) { return "https://vidsrc.xyz/embed/tv?tmdb=" + id + "&season=" + s + "&episode=" + e + "&autoplay=1"; } },
    vidcore: { label: "VidCore", movie: function (id) { return "https://vidcore.org/embed/movie/" + id + "?autoplay=true&theme=ff3d6e"; }, tv: function (id, s, e) { return "https://vidcore.org/embed/tv/" + id + "/" + s + "/" + e + "?autoplay=true&theme=ff3d6e"; } }
  };
  var lanes = [
    ["trending", "Trending"],
    ["movies", "Movies"],
    ["shows", "Shows"],
    ["now", "Now Playing"],
    ["top", "Top Rated"],
    ["saved", "Saved"]
  ];
  var icons = {
    play: '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
    pause: '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
  };
  function $(id) { return document.getElementById(id); }
  function say(msg) { $("vxStatus").textContent = msg || ""; }
  function tmdb(path, params) {
    var u = new URL(TMDB + path);
    u.searchParams.set("api_key", KEY);
    u.searchParams.set("language", "en-US");
    Object.keys(params || {}).forEach(function (k) { if (params[k] != null) u.searchParams.set(k, params[k]); });
    return fetch(u.toString()).then(function (r) { if (!r.ok) throw new Error("TMDB " + r.status); return r.json(); });
  }
  function mapItem(it, type) {
    var media = type || (it.media_type === "tv" ? "tv" : "movie");
    if (it.media_type === "person") return null;
    return { id: it.id, media: media, title: it.title || it.name || "Untitled", year: (it.release_date || it.first_air_date || "").slice(0, 4), poster: it.poster_path ? IMG + it.poster_path : "", backdrop: it.backdrop_path ? IMG + it.backdrop_path : "", vote: it.vote_average || 0 };
  }
  function paintPlay() {
    var on = state.playing;
    app.classList.toggle("playing", on);
    $("vxPlay").innerHTML = on ? icons.pause : icons.play;
    $("vxPlay").setAttribute("aria-label", on ? "Pause" : "Play");
    $("vxCenterIcon").innerHTML = on ? icons.pause : icons.play;
    $("vxMute").classList.toggle("on", state.muted);
    $("vxMute").textContent = state.muted ? "Muted" : "Mute";
    $("vxSpeed").textContent = "Speed " + state.speed + "x";
    $("vxSave").textContent = isSaved() ? "Saved" : "Save";
    $("vxTrailer").classList.toggle("on", state.mode === "trailer");
    var frame = $("vxFrame");
    if (frame) frame.style.filter = "brightness(" + ($("vxBright").value / 100) + ")";
  }
  function isSaved() {
    if (!state.current) return false;
    return state.saved.some(function (x) { return x.id === state.current.id && x.media === state.current.media; });
  }
  function baseUrl() {
    var c = state.current;
    if (!c) return "";
    var s = servers[state.server];
    return c.media === "tv" ? s.tv(c.id, state.season, state.episode) : s.movie(c.id);
  }
  function filmUrl() {
    var url = baseUrl();
    var t = Math.floor(elapsed());
    if (t > 3) url += (url.indexOf("?") >= 0 ? "&" : "?") + "t=" + t + "&start=" + t + "&startAt=" + t;
    if (state.muted) url += "&mute=1";
    return url;
  }
  function elapsed() {
    if (!state.playing || !state.tick) return state.elapsed;
    return state.elapsed + (Date.now() - state.tick) / 1000;
  }
  function ensureFrame() {
    var frame = $("vxFrame");
    if (frame) return frame;
    frame = document.createElement("iframe");
    frame.id = "vxFrame";
    frame.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
    frame.referrerPolicy = "origin";
    $("vxScreen").insertBefore(frame, $("vxPoster"));
    return frame;
  }
  function post(msg) {
    var frame = $("vxFrame");
    if (!frame || !frame.contentWindow) return;
    try { frame.contentWindow.postMessage(msg, "*"); } catch (e) {}
  }
  function play() {
    if (!state.current) return;
    state.mode = "film";
    state.playing = true;
    state.tick = Date.now();
    ensureFrame().src = filmUrl();
    paintPlay();
    say(state.current.title + " is playing on " + servers[state.server].label);
    remember();
  }
  function pause() {
    state.elapsed = elapsed();
    state.playing = false;
    state.tick = 0;
    var frame = $("vxFrame");
    if (frame) frame.src = "about:blank";
    paintPlay();
    say("Paused");
    remember();
  }
  function toggle() { state.playing ? pause() : play(); }
  function remember() {
    if (!state.current) return;
    var row = { id: state.current.id, media: state.current.media, title: state.current.title, poster: state.current.poster, season: state.season, episode: state.episode, elapsed: Math.floor(elapsed()), server: state.server };
    localStorage.setItem("vx-last", JSON.stringify(row));
  }
  function seekTo(sec) {
    state.elapsed = Math.max(0, Math.min(state.duration, sec));
    state.tick = state.playing ? Date.now() : 0;
    if (state.playing) ensureFrame().src = filmUrl();
    paintSeek();
  }
  function paintSeek() {
    var bar = $("vxSeek");
    if (document.activeElement === bar) return;
    bar.value = Math.round((elapsed() / state.duration) * 1000);
  }
  function loadLane(id) {
    state.lane = id;
    document.querySelectorAll("#vxLanes button").forEach(function (b) { b.classList.toggle("on", b.dataset.lane === id); });
    if (id === "saved") { state.items = state.saved.slice(); drawGrid("Saved"); return; }
    say("Loading films");
    var job;
    if (id === "trending") job = tmdb("/trending/movie/week");
    else if (id === "movies") job = tmdb("/movie/popular");
    else if (id === "shows") job = tmdb("/tv/popular");
    else if (id === "now") job = tmdb("/movie/now_playing");
    else job = tmdb("/movie/top_rated");
    job.then(function (data) {
      state.items = (data.results || []).map(function (it) { return mapItem(it, id === "shows" ? "tv" : (id === "trending" ? it.media_type : "movie")); }).filter(Boolean);
      drawGrid($("vxShelfTitle").textContent);
      say("");
    }).catch(function () { say("Could not reach TMDB. Try again."); });
  }
  function drawGrid(title) {
    $("vxShelfTitle").textContent = title;
    var grid = $("vxGrid");
    grid.innerHTML = "";
    state.items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.dpad = "1";
      b.innerHTML = (it.poster ? '<img alt="" src="' + it.poster + '">' : '<img alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27300%27%3E%3Crect fill=%27%23ffe8dc%27 width=%27200%27 height=%27300%27/%3E%3C/svg%3E">') + "<strong></strong><em></em>";
      b.querySelector("strong").textContent = it.title;
      b.querySelector("em").textContent = (it.year || "") + (it.vote ? "  " + Number(it.vote).toFixed(1) : "");
      b.addEventListener("click", function () { openItem(it); });
      grid.appendChild(b);
    });
  }
  function openItem(it, auto) {
    state.current = it;
    state.elapsed = 0;
    state.tick = 0;
    state.playing = false;
    state.mode = "film";
    state.season = it.season || 1;
    state.episode = it.episode || 1;
    $("vxName").textContent = it.title;
    $("vxMeta").textContent = (it.media === "tv" ? "Series" : "Film") + (it.year ? "  " + it.year : "");
    $("vxPoster").src = it.backdrop || it.poster || "";
    var frame = $("vxFrame");
    if (frame) frame.src = "about:blank";
    paintPlay();
    say("Loading details");
    tmdb("/" + it.media + "/" + it.id, { append_to_response: "videos,credits" }).then(function (d) {
      state.detail = d;
      state.duration = ((d.runtime || d.episode_run_time && d.episode_run_time[0] || (it.media === "tv" ? 45 : 110)) * 60) || 5400;
      var vids = ((d.videos || {}).results || []).filter(function (v) { return v.site === "YouTube" && v.type === "Trailer"; });
      state.trailerKey = vids.length ? vids[0].key : "";
      $("vxMeta").textContent = [it.media === "tv" ? "Series" : "Film", (d.release_date || d.first_air_date || "").slice(0, 4), d.runtime ? d.runtime + " min" : "", d.vote_average ? Number(d.vote_average).toFixed(1) : ""].filter(Boolean).join("  ");
      var cast = $("vxCast");
      cast.innerHTML = "";
      ((d.credits || {}).cast || []).slice(0, 10).forEach(function (p) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.dataset.dpad = "1";
        chip.textContent = p.name;
        chip.addEventListener("click", function () { $("vxQ").value = p.name; search(); });
        cast.appendChild(chip);
      });
      if (it.media === "tv") loadSeason(state.season);
      else $("vxEpisodes").innerHTML = "";
      drawQr();
      if (auto) play();
      else say("Ready. Press play.");
    }).catch(function () { say("Details failed. You can still press play."); if (auto) play(); });
    $("vxStage").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function loadSeason(n) {
    state.season = n;
    tmdb("/tv/" + state.current.id + "/season/" + n).then(function (d) {
      state.episodes = d.episodes || [];
      var box = $("vxEpisodes");
      box.innerHTML = "";
      var seasons = (state.detail && state.detail.seasons || []).filter(function (s) { return s.season_number > 0; });
      seasons.forEach(function (s) {
        var b = document.createElement("button");
        b.type = "button";
        b.dataset.dpad = "1";
        b.textContent = "Season " + s.season_number;
        b.classList.toggle("on", s.season_number === n);
        b.addEventListener("click", function () { loadSeason(s.season_number); });
        box.appendChild(b);
      });
      state.episodes.forEach(function (ep) {
        var b = document.createElement("button");
        b.type = "button";
        b.dataset.dpad = "1";
        b.textContent = "E" + ep.episode_number;
        b.classList.toggle("on", ep.episode_number === state.episode);
        b.addEventListener("click", function () {
          state.episode = ep.episode_number;
          state.elapsed = 0;
          if (ep.runtime) state.duration = ep.runtime * 60;
          if (state.playing) play(); else paintPlay();
          loadSeason(state.season);
        });
        box.appendChild(b);
      });
    }).catch(function () { say("Episodes failed to load."); });
  }
  function search() {
    var q = $("vxQ").value.trim();
    if (!q) return loadLane(state.lane);
    say("Searching");
    tmdb("/search/multi", { query: q }).then(function (d) {
      state.items = (d.results || []).map(function (it) { return mapItem(it); }).filter(Boolean);
      drawGrid("Results");
      say(state.items.length ? "" : "No matches");
    }).catch(function () { say("Search failed"); });
  }
  function drawQr() {
    if (!state.current) return;
    var link = location.origin + "/vault/?watch=" + state.current.media + "-" + state.current.id + "&s=" + state.season + "&e=" + state.episode;
    $("vxLink").textContent = link;
    paintCode($("vxQr"), state.current.media.slice(0,1).toUpperCase() + state.current.id);
  }
  function paintCode(canvas, label) {
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff4ec";
    ctx.fillRect(0, 0, 132, 132);
    ctx.strokeStyle = "#ff3d6e";
    ctx.lineWidth = 4;
    ctx.strokeRect(6, 6, 120, 120);
    ctx.fillStyle = "#1c1430";
    ctx.font = "700 18px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("FILM", 66, 58);
    ctx.font = "800 16px Trebuchet MS, sans-serif";
    ctx.fillStyle = "#ff3d6e";
    ctx.fillText(String(label), 66, 82);
  }
  function moveFocus(dir) {
    var items = Array.prototype.slice.call(document.querySelectorAll("[data-dpad]")).filter(function (el) { return el.offsetParent !== null; });
    var cur = document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-dpad]") || $("vxPlay");
    var r = cur.getBoundingClientRect();
    var best = null;
    var score = 1e9;
    items.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var dx = (b.left + b.width / 2) - (r.left + r.width / 2);
      var dy = (b.top + b.height / 2) - (r.top + r.height / 2);
      if (dir === "left" && dx >= -4) return;
      if (dir === "right" && dx <= 4) return;
      if (dir === "up" && dy >= -4) return;
      if (dir === "down" && dy <= 4) return;
      var primary = dir === "left" || dir === "right" ? Math.abs(dx) : Math.abs(dy);
      var secondary = dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx);
      var s = primary + secondary * 2.2;
      if (s < score) { score = s; best = el; }
    });
    if (best) best.focus();
  }
  function bootLanes() {
    var box = $("vxLanes");
    lanes.forEach(function (ln) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.dpad = "1";
      b.dataset.lane = ln[0];
      b.textContent = ln[1];
      b.addEventListener("click", function () { loadLane(ln[0]); });
      box.appendChild(b);
    });
    var box2 = $("vxServers");
    Object.keys(servers).forEach(function (id) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.dpad = "1";
      b.dataset.server = id;
      b.textContent = servers[id].label;
      b.classList.toggle("on", id === state.server);
      b.addEventListener("click", function () {
        state.server = id;
        localStorage.setItem("vx-server", id);
        document.querySelectorAll("#vxServers button").forEach(function (x) { x.classList.toggle("on", x.dataset.server === id); });
        if (state.playing) play();
        else say(servers[id].label + " selected");
      });
      box2.appendChild(b);
    });
  }
  $("vxPlay").innerHTML = icons.play;
  $("vxCenterIcon").innerHTML = icons.play;
  $("vxPlay").addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
  $("vxScreen").addEventListener("click", function (e) { if (e.target === $("vxPlay") || $("vxPlay").contains(e.target)) return; toggle(); });
  $("vxBack10").addEventListener("click", function () { seekTo(elapsed() - 10); });
  $("vxFwd10").addEventListener("click", function () { seekTo(elapsed() + 10); });
  $("vxRestart").addEventListener("click", function () { state.elapsed = 0; if (state.playing) play(); else paintSeek(); });
  $("vxPrev").addEventListener("click", function () { stepEp(-1); });
  $("vxNext").addEventListener("click", function () { stepEp(1); });
  $("vxMute").addEventListener("click", function () {
    state.muted = !state.muted;
    localStorage.setItem("vx-mute", state.muted ? "1" : "0");
    post({ type: state.muted ? "mute" : "unmute", event: "command", func: state.muted ? "mute" : "unMute" });
    if (state.playing) play();
    paintPlay();
  });
  $("vxVol").value = state.volume;
  $("vxVol").addEventListener("input", function () {
    state.volume = Number(this.value);
    localStorage.setItem("vx-vol", String(state.volume));
    post({ type: "volume", value: state.volume / 100 });
    if (state.volume === 0 && !state.muted) { state.muted = true; paintPlay(); }
  });
  $("vxBright").addEventListener("input", paintPlay);
  $("vxSpeed").addEventListener("click", function () {
    var steps = [0.5, 0.75, 1, 1.25, 1.5, 2];
    state.speed = steps[(steps.indexOf(state.speed) + 1) % steps.length];
    post({ type: "speed", value: state.speed, event: "command", func: "setPlaybackRate", args: [state.speed] });
    paintPlay();
  });
  $("vxFull").addEventListener("click", function () {
    var node = $("vxStage");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (node.requestFullscreen) node.requestFullscreen();
  });
  $("vxTrailer").addEventListener("click", function () {
    if (!state.trailerKey) { say("No trailer on TMDB for this title"); return; }
    state.mode = "trailer";
    state.playing = true;
    state.tick = Date.now();
    ensureFrame().src = "https://www.youtube-nocookie.com/embed/" + state.trailerKey + "?autoplay=1&rel=0&modestbranding=1";
    paintPlay();
    say("Trailer");
  });
  $("vxSave").addEventListener("click", function () {
    if (!state.current) return;
    if (isSaved()) state.saved = state.saved.filter(function (x) { return !(x.id === state.current.id && x.media === state.current.media); });
    else state.saved.unshift(state.current);
    localStorage.setItem("vx-saved", JSON.stringify(state.saved.slice(0, 60)));
    paintPlay();
  });
  $("vxSeek").addEventListener("change", function () { seekTo((Number(this.value) / 1000) * state.duration); });
  $("vxQ").addEventListener("keydown", function (e) { if (e.key === "Enter") search(); });
  $("vxMic").addEventListener("click", function () {
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) { say("Voice input is not available on this device"); return; }
    var rec = new Rec();
    rec.onresult = function (ev) { $("vxQ").value = ev.results[0][0].transcript; search(); };
    rec.start();
    say("Listening");
  });
  $("vxSync").addEventListener("click", function () { $("vxSyncBox").classList.toggle("open"); drawQr(); });
  $("vxCopy").addEventListener("click", function () { navigator.clipboard && navigator.clipboard.writeText($("vxLink").textContent); say("Link copied"); });
  function stepEp(dir) {
    if (!state.current) return;
    if (state.current.media !== "tv") {
      var idx = state.items.findIndex(function (x) { return x.id === state.current.id; });
      var nxt = state.items[idx + dir];
      if (nxt) openItem(nxt, state.playing);
      return;
    }
    var n = state.episode + dir;
    if (n < 1) return;
    state.episode = n;
    state.elapsed = 0;
    if (state.playing) play();
    loadSeason(state.season);
  }
  document.addEventListener("keydown", function (e) {
    var typing = document.activeElement && document.activeElement.id === "vxQ";
    if (e.key === "Escape") {
      if (document.fullscreenElement) document.exitFullscreen();
      else if ($("vxSyncBox").classList.contains("open")) $("vxSyncBox").classList.remove("open");
      else $("vxQ").focus();
      return;
    }
    if (typing) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
      var onSeek = document.activeElement === $("vxSeek") || document.activeElement === $("vxVol") || document.activeElement === $("vxBright");
      if (!onSeek && (document.activeElement === $("vxScreen") || document.activeElement === $("vxPlay"))) {
        if (e.key === "ArrowLeft") seekTo(elapsed() - 10);
        if (e.key === "ArrowRight") seekTo(elapsed() + 10);
        if (e.key === "ArrowUp") { $("vxVol").value = Math.min(100, Number($("vxVol").value) + 5); $("vxVol").dispatchEvent(new Event("input")); }
        if (e.key === "ArrowDown") { $("vxVol").value = Math.max(0, Number($("vxVol").value) - 5); $("vxVol").dispatchEvent(new Event("input")); }
        e.preventDefault();
        return;
      }
      if (!onSeek) { e.preventDefault(); moveFocus(e.key.replace("Arrow", "").toLowerCase()); }
      return;
    }
    if (e.key === "Enter" && document.activeElement && document.activeElement.click && document.activeElement !== $("vxQ")) return;
    if (e.key === " " || e.key === "MediaPlayPause" || e.key === "k") {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === "BUTTON" && document.activeElement.id !== "vxPlay") return;
      e.preventDefault();
      toggle();
    }
    if (e.key === "f") $("vxFull").click();
    if (e.key === "m") $("vxMute").click();
    if (e.key === "n") stepEp(1);
    if (e.key === "p") stepEp(-1);
  });
  setInterval(function () { if (state.playing) paintSeek(); }, 800);
  bootLanes();
  var params = new URLSearchParams(location.search);
  var watch = params.get("watch");
  if (watch && watch.indexOf("-") > 0) {
    var bits = watch.split("-");
    openItem({ id: Number(bits[1]), media: bits[0], title: "Loading", season: Number(params.get("s") || 1), episode: Number(params.get("e") || 1) }, true);
  }
  loadLane("trending");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/vault/sw.js", { scope: "/vault/" }).catch(function () {});
})();
</script>
