<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ea580c">
<title>Stage</title>
<!-- isolated portal, skip reels-boot.js injection -->
<style>
:root {
  --accent-brand: #ea580c;
  --player-bg: #090d16;
  --controls-bg: rgba(9, 13, 22, 0.9);
  --text-main: #f8fafc;
}
body { font-family: system-ui, -apple-system, sans-serif; background: #020617; color: var(--text-main); margin: 0; min-height: 100dvh; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
#vxTop { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 14px 0; }
#vxTop b { font-size: 20px; letter-spacing: -0.03em; }
#vxTop b i { font-style: normal; color: var(--accent-brand); }
.server-picker, #vxQ { background: var(--player-bg); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; font-size: 14px; outline: none; }
#vxQ { flex: 1; min-width: 180px; height: 38px; }
#vxMic { background: var(--accent-brand); border: 0; border-radius: 8px; height: 38px; padding: 0 12px; font-weight: 700; }
.wrap { width: min(980px, calc(100% - 24px)); margin: 16px auto 28px; display: grid; gap: 14px; }
.universal-player { position: relative; width: 100%; aspect-ratio: 16/9; min-height: 46dvh; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7); }
.stream-frame { width: 100%; height: 100%; border: none; background: #000; }
.click-glass { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 78px); z-index: 10; cursor: pointer; }
.custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, var(--controls-bg)); padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
.progress-bar-wrap { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; cursor: pointer; position: relative; }
.progress-bar-fill { height: 100%; width: 0%; background: var(--accent-brand); border-radius: 4px; }
.controls-row, .controls-group { display: flex; align-items: center; gap: 10px; }
.controls-row { justify-content: space-between; flex-wrap: wrap; }
button.ctl { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); font-size: 13px; padding: 6px 12px; border-radius: 6px; }
button.ctl:hover, button.ctl.on, button.ctl:focus, select:focus, #vxQ:focus, .card:focus { outline: 2px solid var(--accent-brand); outline-offset: 2px; }
button.ctl.on { background: var(--accent-brand); border-color: var(--accent-brand); }
.timestamp { font-size: 13px; font-family: ui-monospace, monospace; opacity: 0.8; }
#vxTitle { margin: 0; font-size: 18px; }
#vxMeta { margin: 4px 0 0; color: #94a3b8; font-size: 13px; }
#vxLanes, #vxEps, #vxGrid { display: flex; gap: 8px; overflow: auto; }
#vxGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.card { text-align: left; background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 0 0 8px; overflow: hidden; }
.card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #111827; }
.card strong { display: block; padding: 8px 8px 0; font-size: 12px; }
#vxStatus { color: #94a3b8; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div id="vxTop">
  <b>BWHS <i>Stage</i></b>
  <select id="server-select" class="server-picker" data-dpad aria-label="Server"></select>
  <input id="vxQ" data-dpad type="search" placeholder="Search films and shows" aria-label="Search">
  <button id="vxMic" class="ctl" type="button" data-dpad>Mic</button>
</div>
<div class="wrap">
  <div>
    <h2 id="vxTitle">Pick a film</h2>
    <p id="vxMeta">Play and pause sit on the picture. The other controls sit under it.</p>
  </div>
  <div class="universal-player" id="player-wrapper">
    <iframe id="api-frame" class="stream-frame" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="origin"></iframe>
    <div class="click-glass" id="glass-layer" data-dpad tabindex="0" aria-label="Playback screen"></div>
    <div class="custom-controls">
      <div class="progress-bar-wrap" id="timeline-track" data-dpad tabindex="0" aria-label="Seek">
        <div class="progress-bar-fill" id="timeline-fill"></div>
      </div>
      <div class="controls-row">
        <div class="controls-group">
          <button class="ctl" id="play-btn" type="button" data-dpad>Play</button>
          <button class="ctl" id="back-btn" type="button" data-dpad>Back 10</button>
          <button class="ctl" id="fwd-btn" type="button" data-dpad>Forward 10</button>
          <button class="ctl" id="toggle-mute" type="button" data-dpad>Mute</button>
          <div class="timestamp"><span id="current-time">00:00</span></div>
        </div>
        <div class="controls-group">
          <button class="ctl" id="prev-btn" type="button" data-dpad>Previous</button>
          <button class="ctl" id="next-btn" type="button" data-dpad>Next</button>
          <button class="ctl" id="fs-btn" type="button" data-dpad>Fullscreen</button>
        </div>
      </div>
    </div>
  </div>
  <div id="vxLanes"></div>
  <div id="vxEps"></div>
  <div id="vxStatus"></div>
  <div id="vxGrid"></div>
</div>
<script>
(function () {
  var KEY = "129637a8869a61522af21b80f6eb5129";
  var TMDB = "https://api.themoviedb.org/3";
  var IMG = "https://image.tmdb.org/t/p/w342";
  var frame = document.getElementById("api-frame");
  var select = document.getElementById("server-select");
  var playBtn = document.getElementById("play-btn");
  var muteBtn = document.getElementById("toggle-mute");
  var glass = document.getElementById("glass-layer");
  var fill = document.getElementById("timeline-fill");
  var track = document.getElementById("timeline-track");
  var wrapper = document.getElementById("player-wrapper");
  var timeDisplay = document.getElementById("current-time");
  var servers = {
    videasy: { label: "Videasy", movie: function (id) { return "https://player.videasy.net/movie/" + id + "?autoplay=true&nextButton=false"; }, tv: function (id, s, e) { return "https://player.videasy.net/tv/" + id + "/" + s + "/" + e + "?autoplay=true&nextButton=false"; } },
    vixsrc: { label: "VixSrc", movie: function (id) { return "https://vixsrc.to/movie/" + id + "?autoplay=1"; }, tv: function (id, s, e) { return "https://vixsrc.to/tv/" + id + "/" + s + "/" + e + "?autoplay=1"; } },
    vidlink: { label: "VidLink", movie: function (id) { return "https://vidlink.pro/movie/" + id + "?primaryColor=ea580c&autoplay=true&next=0"; }, tv: function (id, s, e) { return "https://vidlink.pro/tv/" + id + "/" + s + "/" + e + "?primaryColor=ea580c&autoplay=true&next=0"; } },
    vidsrc: { label: "VidSrc", movie: function (id) { return "https://vidsrc.xyz/embed/movie?tmdb=" + id + "&autoplay=1"; }, tv: function (id, s, e) { return "https://vidsrc.xyz/embed/tv?tmdb=" + id + "&season=" + s + "&episode=" + e + "&autoplay=1"; } },
    vidcore: { label: "VidCore", movie: function (id) { return "https://vidcore.org/embed/movie/" + id + "?autoplay=true&theme=ea580c"; }, tv: function (id, s, e) { return "https://vidcore.org/embed/tv/" + id + "/" + s + "/" + e + "?autoplay=true&theme=ea580c"; } }
  };
  var state = { server: "videasy", current: null, season: 1, episode: 1, items: [], playing: false, muted: false, elapsed: 0, tick: 0, duration: 5400 };
  Object.keys(servers).forEach(function (id) {
    var o = document.createElement("option");
    o.value = id; o.textContent = servers[id].label;
    select.appendChild(o);
  });
  function say(msg) { document.getElementById("vxStatus").textContent = msg || ""; }
  function tmdb(path, params) {
    var u = new URL(TMDB + path);
    u.searchParams.set("api_key", KEY);
    u.searchParams.set("language", "en-US");
    Object.keys(params || {}).forEach(function (k) { if (params[k] != null) u.searchParams.set(k, params[k]); });
    return fetch(u.toString()).then(function (r) { if (!r.ok) throw new Error("TMDB " + r.status); return r.json(); });
  }
  function elapsed() { return state.playing && state.tick ? state.elapsed + (Date.now() - state.tick) / 1000 : state.elapsed; }
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function paint() {
    var p = Math.min(100, (elapsed() / state.duration) * 100);
    fill.style.width = p + "%";
    timeDisplay.textContent = fmt(elapsed());
    playBtn.textContent = state.playing ? "Pause" : "Play";
    playBtn.classList.toggle("on", state.playing);
    muteBtn.textContent = state.muted ? "Unmute" : "Mute";
    muteBtn.classList.toggle("on", state.muted);
  }
  function source(withStart) {
    var c = state.current;
    if (!c) return "about:blank";
    var s = servers[state.server];
    var url = c.media === "tv" ? s.tv(c.id, state.season, state.episode) : s.movie(c.id);
    var t = Math.floor(elapsed());
    if (withStart && t > 3) url += (url.indexOf("?") >= 0 ? "&" : "?") + "t=" + t + "&start=" + t + "&startAt=" + t;
    if (state.muted) url += "&mute=1";
    return url;
  }
  function post(payload) {
    try { frame.contentWindow.postMessage(JSON.stringify(payload), "*"); frame.contentWindow.postMessage(payload, "*"); } catch (e) {}
  }
  function play() {
    if (!state.current) return;
    state.playing = true;
    state.tick = Date.now();
    frame.src = source(true);
    post({ event: "command", func: "playVideo" });
    post({ method: "play" });
    paint();
    say(state.current.title + " on " + servers[state.server].label);
  }
  function pause() {
    state.elapsed = elapsed();
    state.playing = false;
    state.tick = 0;
    post({ event: "command", func: "pauseVideo" });
    post({ method: "pause" });
    frame.src = "about:blank";
    paint();
    say("Paused");
  }
  function toggle() { state.playing ? pause() : play(); }
  function seekTo(sec) {
    state.elapsed = Math.max(0, Math.min(state.duration, sec));
    state.tick = state.playing ? Date.now() : 0;
    post({ event: "command", func: "seekTo", args: [Math.floor(state.elapsed), true] });
    if (state.playing) frame.src = source(true);
    paint();
  }
  function openItem(it, auto) {
    state.current = it;
    state.elapsed = 0;
    state.tick = 0;
    state.playing = false;
    state.season = it.season || 1;
    state.episode = it.episode || 1;
    frame.src = "about:blank";
    document.getElementById("vxTitle").textContent = it.title;
    document.getElementById("vxMeta").textContent = (it.media === "tv" ? "Series" : "Film") + (it.year ? "  " + it.year : "");
    paint();
    tmdb("/" + it.media + "/" + it.id).then(function (d) {
      state.duration = ((d.runtime || (d.episode_run_time && d.episode_run_time[0]) || (it.media === "tv" ? 45 : 110)) * 60) || 5400;
      if (it.media === "tv") loadSeason(state.season);
      else document.getElementById("vxEps").innerHTML = "";
      if (auto) play(); else say("Ready. Press play.");
    }).catch(function () { if (auto) play(); else say("Ready. Press play."); });
  }
  function loadSeason(n) {
    state.season = n;
    tmdb("/tv/" + state.current.id + "/season/" + n).then(function (d) {
      var box = document.getElementById("vxEps");
      box.innerHTML = "";
      (d.episodes || []).forEach(function (ep) {
        var b = document.createElement("button");
        b.className = "ctl" + (ep.episode_number === state.episode ? " on" : "");
        b.type = "button"; b.dataset.dpad = "1";
        b.textContent = "E" + ep.episode_number;
        b.addEventListener("click", function () {
          state.episode = ep.episode_number;
          state.elapsed = 0;
          if (ep.runtime) state.duration = ep.runtime * 60;
          if (state.playing) play(); else paint();
          loadSeason(n);
        });
        box.appendChild(b);
      });
    }).catch(function () {});
  }
  function draw(items, title) {
    state.items = items;
    if (title) document.getElementById("vxMeta").textContent = title;
    var grid = document.getElementById("vxGrid");
    grid.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "card"; b.type = "button"; b.dataset.dpad = "1";
      b.innerHTML = (it.poster ? '<img alt="" src="' + it.poster + '">' : "") + "<strong></strong>";
      b.querySelector("strong").textContent = it.title;
      b.addEventListener("click", function () { openItem(it, true); });
      grid.appendChild(b);
    });
  }
  function mapItem(it, media) {
    if (!it || it.media_type === "person") return null;
    return { id: it.id, media: media || (it.media_type === "tv" ? "tv" : "movie"), title: it.title || it.name || "Untitled", year: (it.release_date || it.first_air_date || "").slice(0, 4), poster: it.poster_path ? IMG + it.poster_path : "" };
  }
  function loadLane(kind) {
    var path = kind === "shows" ? "/tv/popular" : kind === "top" ? "/movie/top_rated" : kind === "now" ? "/movie/now_playing" : "/trending/movie/week";
    say("Loading");
    tmdb(path).then(function (d) {
      draw((d.results || []).map(function (it) { return mapItem(it, kind === "shows" ? "tv" : "movie"); }).filter(Boolean), kind);
      say("");
    }).catch(function () { say("TMDB did not answer"); });
  }
  [["trending", "Trending"], ["movies", "Movies"], ["shows", "Shows"], ["now", "Now Playing"], ["top", "Top Rated"]].forEach(function (ln) {
    var b = document.createElement("button");
    b.className = "ctl"; b.type = "button"; b.dataset.dpad = "1"; b.textContent = ln[1];
    b.addEventListener("click", function () { loadLane(ln[0]); });
    document.getElementById("vxLanes").appendChild(b);
  });
  select.addEventListener("change", function () {
    state.server = select.value;
    if (state.playing) play();
  });
  glass.addEventListener("click", toggle);
  playBtn.addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
  document.getElementById("back-btn").addEventListener("click", function () { seekTo(elapsed() - 10); });
  document.getElementById("fwd-btn").addEventListener("click", function () { seekTo(elapsed() + 10); });
  muteBtn.addEventListener("click", function () {
    state.muted = !state.muted;
    post({ event: "command", func: "setVolume", args: [state.muted ? 0 : 1] });
    post({ method: "setVolume", value: state.muted ? 0 : 1 });
    if (state.playing) play();
    paint();
  });
  track.addEventListener("click", function (e) {
    var rect = track.getBoundingClientRect();
    seekTo(((e.clientX - rect.left) / rect.width) * state.duration);
  });
  document.getElementById("fs-btn").addEventListener("click", function () {
    if (!document.fullscreenElement) wrapper.requestFullscreen().catch(function () {});
    else document.exitFullscreen();
  });
  document.getElementById("next-btn").addEventListener("click", function () { step(1); });
  document.getElementById("prev-btn").addEventListener("click", function () { step(-1); });
  function step(dir) {
    if (!state.current) return;
    if (state.current.media === "tv") {
      state.episode = Math.max(1, state.episode + dir);
      state.elapsed = 0;
      if (state.playing) play();
      loadSeason(state.season);
      return;
    }
    var idx = state.items.findIndex(function (x) { return x.id === state.current.id; });
    if (state.items[idx + dir]) openItem(state.items[idx + dir], true);
  }
  document.getElementById("vxQ").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var q = this.value.trim();
    if (!q) return;
    tmdb("/search/multi", { query: q }).then(function (d) {
      draw((d.results || []).map(function (it) { return mapItem(it); }).filter(Boolean), "Results");
    });
  });
  document.getElementById("vxMic").addEventListener("click", function () {
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) { say("Voice input is not available here"); return; }
    var rec = new Rec();
    rec.onresult = function (ev) { document.getElementById("vxQ").value = ev.results[0][0].transcript; document.getElementById("vxQ").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" })); };
    rec.start();
  });
  document.addEventListener("keydown", function (e) {
    if (document.activeElement && document.activeElement.id === "vxQ") return;
    if (e.key === "Escape" && document.fullscreenElement) { document.exitFullscreen(); return; }
    if ((e.key === " " || e.key === "k" || e.key === "MediaPlayPause") && !(document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement.id !== "play-btn")) { e.preventDefault(); toggle(); }
    if (e.key === "f") document.getElementById("fs-btn").click();
    if (e.key === "m") muteBtn.click();
    if (e.key === "ArrowLeft" && (document.activeElement === glass || document.activeElement === playBtn)) { e.preventDefault(); seekTo(elapsed() - 10); return; }
    if (e.key === "ArrowRight" && (document.activeElement === glass || document.activeElement === playBtn)) { e.preventDefault(); seekTo(elapsed() + 10); return; }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
      if (document.activeElement === track) return;
      e.preventDefault();
      var dir = e.key.replace("Arrow", "").toLowerCase();
      var items = Array.prototype.slice.call(document.querySelectorAll("[data-dpad]")).filter(function (el) { return el.offsetParent !== null; });
      var cur = document.activeElement && document.activeElement.closest ? document.activeElement.closest("[data-dpad]") : playBtn;
      if (!cur || !cur.getBoundingClientRect) cur = playBtn;
      var r = cur.getBoundingClientRect(), best = null, score = 1e9;
      items.forEach(function (el) {
        if (el === cur) return;
        var b = el.getBoundingClientRect();
        var dx = (b.left + b.width / 2) - (r.left + r.width / 2);
        var dy = (b.top + b.height / 2) - (r.top + r.height / 2);
        if (dir === "left" && dx >= -4) return;
        if (dir === "right" && dx <= 4) return;
        if (dir === "up" && dy >= -4) return;
        if (dir === "down" && dy <= 4) return;
        var s = (dir === "left" || dir === "right" ? Math.abs(dx) : Math.abs(dy)) + (dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx)) * 2.2;
        if (s < score) { score = s; best = el; }
      });
      if (best) best.focus();
    }
  });
  setInterval(paint, 500);
  var watch = new URLSearchParams(location.search).get("watch");
  if (watch && watch.indexOf("-") > 0) {
    var bits = watch.split("-");
    openItem({ id: Number(bits[1]), media: bits[0], title: "Loading", season: 1, episode: 1 }, true);
  }
  loadLane("trending");
})();
</script>
</body>
</html>
