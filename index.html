<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --font-sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Instrument Serif", Georgia, serif;
  --font-ui: "Sora", "Manrope", ui-sans-serif, system-ui, sans-serif;
  --bg: #090614; --surface: #15101f; --elevated: #221a32; --fg: #f7f2ff;
  --muted: #b4a6cc; --subtle: #7d7194; --accent: #ff4d9a; --accent-fg: #1a0712;
  --accent-2: #7c5cff;
  --line: color-mix(in oklab, var(--fg) 14%, transparent);
  --glow: rgba(255,77,154,.28);
  --radius: 18px;
}
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:var(--font-sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
* { box-sizing:border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
img { max-width:100%; display:block; }
.app { height:100dvh; position:relative; background:
  radial-gradient(1200px 520px at 85% -8%, color-mix(in oklab, var(--accent) 20%, transparent), transparent 56%),
  radial-gradient(820px 420px at -12% 108%, color-mix(in oklab, var(--accent-2) 16%, transparent), transparent 52%),
  var(--bg);
  color:var(--fg); transition: background .35s ease, color .35s ease; }
.font-display { font-family: var(--font-display); }

header.top {
  position:absolute; left:0; right:0; z-index:20; padding: max(.7rem, env(safe-area-inset-top)) 14px 0;
  background: linear-gradient(to bottom, color-mix(in oklab, var(--bg) 88%, transparent), transparent);
  pointer-events:none;
}
header.top > * { pointer-events:auto; }
.brand-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand {
  display:flex; align-items:baseline; gap:6px; filter: drop-shadow(0 6px 18px var(--glow));
  min-width:0;
}
.brand h1 {
  margin:0; font-family:var(--font-display); font-size: clamp(1.55rem, 5.6vw, 2.4rem);
  letter-spacing:-.045em; line-height:.9;
  background: linear-gradient(120deg, var(--fg) 8%, var(--accent) 36%, var(--accent-2) 62%, var(--fg) 92%);
  background-size: 220% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation: shine 7s ease-in-out infinite;
}
.brand em { font-style:italic; font-size:.42em; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); opacity:.85; margin-left:2px; }
@keyframes shine { 0%,70%{background-position:0% 50%} 85%{background-position:100% 50%} 100%{background-position:0% 50%} }

.icon-btn {
  width:38px; height:38px; border-radius:999px; border:1px solid var(--line);
  background: color-mix(in oklab, var(--elevated) 80%, transparent);
  display:grid; place-items:center; backdrop-filter: blur(10px);
  flex:none;
}
.icon-btn:active { transform: scale(.96); }
.tools { display:flex; gap:6px; align-items:center; flex:none; }
.pill-auto {
  display:flex; align-items:center; gap:6px; height:38px; padding:0 10px; border-radius:999px;
  border:1px solid var(--line); background: color-mix(in oklab, var(--elevated) 80%, transparent);
  font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.switch { width:34px; height:20px; border-radius:999px; background:var(--elevated); border:1px solid var(--line); position:relative; }
.switch.on { background:var(--accent); }
.switch i { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--fg); transition: transform .18s; }
.switch.on i { transform: translateX(14px); background:var(--accent-fg); }

.lanes { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:6px; scrollbar-width:none; }
.lanes::-webkit-scrollbar { display:none; }
.lane {
  height:32px; padding:0 12px; border-radius:999px; white-space:nowrap; font-size:12px; font-weight:600;
  background: color-mix(in oklab, var(--elevated) 80%, transparent); color:var(--muted);
  border:1px solid transparent; transition: background .18s, color .18s, box-shadow .18s;
}
.lane.on {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-fg);
  box-shadow: 0 6px 16px color-mix(in oklab, var(--accent) 30%, transparent);
}
.year-wrap, .genre-wrap, .studio-wrap { position:relative; flex:none; }
.genre-inline { display:none !important; }
.genre-sheet .lane, .studio-sheet .lane { margin:0; }
.year-btn {
  height:32px; padding:0 12px; border-radius:999px; font-size:12px; font-weight:600;
  background: color-mix(in oklab, var(--elevated) 80%, transparent); color:var(--muted);
  border:1px solid var(--line); display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.year-btn.on {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-fg); border-color:transparent;
}
.year-menu {
  display:none; position:fixed; top: max(88px, calc(env(safe-area-inset-top) + 72px)); left:12px; z-index:90;
  width:min(92vw, 380px);
  background: color-mix(in oklab, var(--surface) 96%, transparent);
  backdrop-filter: blur(18px); border:1px solid var(--line); border-radius:16px;
  padding:12px; max-height:min(70dvh, 520px); overflow:auto;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.year-menu.open, .genre-sheet.open, .studio-sheet.open { display:block; }
.genre-sheet, .studio-sheet {
  display:none; position:fixed; top: max(88px, calc(env(safe-area-inset-top) + 72px)); left:12px; z-index:90;
  width:min(92vw, 380px);
  background: color-mix(in oklab, var(--surface) 96%, transparent);
  backdrop-filter: blur(18px); border:1px solid var(--line); border-radius:16px;
  padding:12px; max-height:min(70dvh, 520px); overflow:auto;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.year-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.year-grid button {
  height:34px; border-radius:10px; border:1px solid var(--line);
  background:var(--elevated); font-size:12px; font-weight:600;
}
.year-grid button.on { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--accent-fg); border-color:transparent; }
.welcome {
  position:absolute; inset:0; z-index:80; display:grid; place-items:end center;
  background: color-mix(in oklab, var(--bg) 55%, transparent);
  padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
}
.welcome .card {
  width:min(420px, 100%);
  background: color-mix(in oklab, var(--surface) 96%, transparent);
  border:1px solid var(--line); border-radius:22px; padding:20px 18px 16px;
  backdrop-filter: blur(18px);
}
.welcome h3 { margin:0 0 8px; font-family:var(--font-display); font-size:1.7rem; }
.welcome p { margin:0 0 12px; color:var(--muted); font-size:14px; line-height:1.45; }
.welcome a { color:var(--accent); text-decoration:none; font-weight:700; }
.welcome .links { display:flex; flex-direction:column; gap:8px; margin:10px 0 16px; }
.welcome .links a {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--elevated);
  color:var(--fg); font-weight:600; font-size:13px;
}
.welcome .acts { display:flex; gap:8px; }
.welcome .acts button { flex:1; height:44px; border-radius:999px; font-weight:700; font-size:13px; }
.welcome .ghost { border:1px solid var(--line); background:var(--elevated); }

.feed { height:100dvh; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; }
.feed::-webkit-scrollbar { display:none; }
.slide { height:100dvh; scroll-snap-align:start; position:relative; overflow:hidden; }
.stage { position:absolute; inset:0; }
.slide img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.06); }
.slide.active img.bg { animation: ken 22s linear alternate infinite; }
.trailer-cover { position:absolute; inset:0; overflow:hidden; background:transparent; pointer-events:none; }
.trailer-cover iframe {
  position:absolute; top:50%; left:50%; border:0;
  height:280%; width:280%; min-width:280%; min-height:280%;
  transform:translate(-50%,-52%);
  opacity:0; transition: opacity .7s ease;
  pointer-events:none !important;
}
.trailer-cover.ready iframe { opacity:1; }
.trailer-hit {
  position:absolute; inset:0; z-index:3;
  background:transparent;
  pointer-events:auto;
}
.rail, .meta { pointer-events:auto; }
.meta { pointer-events:none; }
.meta button, .meta [data-open], .cast-row { pointer-events:auto; }
.paused-badge { display:none !important; }
@keyframes ken { from{transform:scale(1.06)} to{transform:scale(1.16)} }
.veil { position:absolute; inset:0; background:
  linear-gradient(to top, color-mix(in oklab, var(--bg) 92%, transparent) 0%, transparent 42%),
  linear-gradient(to right, color-mix(in oklab, var(--bg) 55%, transparent), transparent 40%);
  pointer-events:none;
}
.meta { position:absolute; left:14px; right:86px; bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px)); z-index:11; pointer-events:none; }
.meta button, .meta [data-open], .cast-row { pointer-events:auto; }
.kicker { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
.meta h2 { margin:0 0 8px; font-family:var(--font-display); font-size: clamp(1.55rem, 5.6vw, 2.3rem); line-height:.95; letter-spacing:-.03em; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.title-art {
  width:46px; height:69px; border-radius:8px; overflow:hidden; flex:none;
  border:1px solid var(--line); box-shadow: 0 6px 16px rgba(0,0,0,.35);
  background:var(--elevated); padding:0;
}
.title-art img { width:100%; height:100%; object-fit:cover; display:block; }
.poster-view {
  position:absolute; inset:0; z-index:70; background:rgba(0,0,0,.72);
  display:grid; place-items:center; padding:24px 16px calc(20px + env(safe-area-inset-bottom));
}
.poster-view img {
  max-width:min(86vw, 420px); max-height:78dvh; width:auto; height:auto;
  border-radius:16px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
}
.poster-view .pv-close {
  margin-top:14px; height:44px; padding:0 22px; border-radius:999px;
  background:var(--accent); color:var(--accent-fg); font-weight:700;
}
.ep-chip {
  font-family:var(--font-sans); font-size:11px; font-weight:700; letter-spacing:.08em;
  padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background: color-mix(in oklab, var(--elevated) 75%, transparent); color:var(--accent);
}
.meta p { margin:0; color:var(--muted); font-size:13px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.cast-row { display:flex; gap:10px; overflow-x:auto; margin-top:12px; scrollbar-width:none; }
.cast-row::-webkit-scrollbar{display:none}
.cast { width:58px; flex:none; text-align:center; }
.cast img, .cast .ph { width:46px; height:46px; border-radius:50%; object-fit:cover; margin:0 auto 4px; background:var(--elevated); display:grid; place-items:center; font-size:14px; }
.cast span { font-size:10px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.rail { position:absolute; right:10px; bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px)); display:flex; flex-direction:column; align-items:center; gap:12px; z-index:12; pointer-events:auto; }
.rail .studio { display:flex; flex-direction:column; align-items:center; gap:6px; width:72px; }
.studio .mark {
  width:48px; height:48px; border-radius:14px;
  background: #f4f0e8;
  color:#111; display:grid; place-items:center; overflow:hidden;
  border:1px solid rgba(255,255,255,.18);
  box-shadow: 0 6px 16px rgba(0,0,0,.28);
  padding:5px;
}
.studio .mark.dark { background:#121216; }
.studio .mark img { max-width:38px; max-height:28px; width:auto; height:auto; object-fit:contain; filter: none; }
.rail-art {
  width:46px; aspect-ratio:2/3; border-radius:8px; overflow:hidden;
  border:1px solid var(--line); box-shadow: 0 6px 14px rgba(0,0,0,.35);
  background:var(--elevated);
}
.rail-art img { width:100%; height:100%; object-fit:cover; }
.studio small { font-size:10px; color:var(--muted); width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.play {
  width:44px; height:44px; border-radius:50%;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  color:var(--accent-fg);
  display:grid; place-items:center;
  box-shadow: 0 10px 26px color-mix(in oklab, var(--accent) 36%, transparent);
  border:1px solid color-mix(in oklab, var(--accent-fg) 8%, transparent);
}
.play:active { transform:scale(.96); }
.play-lab { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-top:4px; }
.rbtn { display:flex; flex-direction:column; align-items:center; gap:4px; }
.rbtn i { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background: color-mix(in oklab, var(--elevated) 70%, transparent); display:grid; place-items:center; backdrop-filter:blur(8px); }
.rbtn span { font-size:10px; color:var(--muted); }
.saved i { color: #ff6b7a; }

.boot { position:absolute; inset:0; display:grid; place-items:center; z-index:5; }
.boot .logo { font-family:var(--font-display); font-size:3.2rem; letter-spacing:-.04em; }
.spin { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:12px auto 0; }
@keyframes spin { to { transform:rotate(360deg) } }

.overlay { position:absolute; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; min-height:0; }
.ov-head { display:flex; align-items:center; gap:8px; padding: max(.7rem, env(safe-area-inset-top)) 12px 10px; }
.ov-head h3 { margin:0; font-size:16px; font-weight:700; }
.cat-sticky {
  position:sticky; top:0; z-index:6;
  background: color-mix(in oklab, var(--bg) 94%, transparent);
  backdrop-filter: blur(16px);
  border-bottom:1px solid var(--line);
}
.search-wrap { position:relative; flex:1; }
.search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.55; }
.search-wrap input {
  width:100%; height:44px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--fg); padding:0 14px 0 40px; outline:none;
}
.ov-body { flex:1; overflow:auto; padding: 8px 12px 32px; min-height:0; }
.sec { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:16px 0 8px; }
.row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:8px; border-radius:16px; }
.row:hover { background: color-mix(in oklab, var(--elevated) 60%, transparent); }
.row img, .row .ph { width:48px; height:72px; border-radius:8px; object-fit:cover; background:var(--elevated); flex:none; }
.chip { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); margin:0 6px 8px 0; font-size:13px; }
.people { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
.grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px; }
.card { text-align:left; position:relative; min-width:0; }
.card img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:10px; background:var(--elevated); }
.card b { display:block; margin-top:6px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card small { color:var(--muted); font-size:11px; }
.card .heart {
  position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%;
  background: rgba(0,0,0,.55); display:grid; place-items:center; border:1px solid var(--line);
}
.card .heart.on { color:#ff6b7a; }
.tip {
  position:absolute; top:88px; right:24px; z-index:30;
  background: color-mix(in oklab, var(--surface) 92%, transparent);
  border:1px solid var(--line); border-radius:16px; padding:12px 14px; max-width:240px;
  backdrop-filter: blur(12px); font-size:13px; line-height:1.4;
}
.tip kbd { font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
.cat-hero { display:flex; gap:12px; align-items:center; padding: 0 16px 10px; }
.cat-hero img, .cat-hero .ph { width:44px; height:44px; border-radius:12px; object-fit:cover; background:var(--elevated); flex:none; }

.sheet {
  position:absolute; left:0; right:0; bottom:0; z-index:45;
  background: color-mix(in oklab, var(--surface) 94%, transparent);
  backdrop-filter: blur(18px); border-top:1px solid var(--line);
  border-radius: 24px 24px 0 0; padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
  max-height: 72dvh; overflow:auto;
  transform: translateY(110%);
  animation: sheetUp .32s cubic-bezier(.2,.8,.2,1) forwards;
}
.sheet.out { animation: sheetDown .24s ease forwards; }
@keyframes sheetUp { from { transform:translateY(110%); opacity:.4 } to { transform:translateY(0); opacity:1 } }
@keyframes sheetDown { from { transform:translateY(0); opacity:1 } to { transform:translateY(110%); opacity:0 } }
.sheet h2 { font-family:var(--font-display); font-size:1.8rem; margin:0 0 8px; }
.cta { height:48px; border-radius:999px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--accent-fg); font-weight:700; padding:0 22px; box-shadow:0 10px 22px color-mix(in oklab,var(--accent) 28%,transparent); }
.toast {
  position:absolute; left:50%; bottom: max(18px, env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:80;
  background: color-mix(in oklab, var(--surface) 92%, transparent);
  border:1px solid var(--line); border-radius:999px; padding:8px 14px;
  font-size:12px; font-weight:700; backdrop-filter:blur(12px);
  pointer-events:none; white-space:nowrap;
}

.player { position:absolute; inset:0; z-index:50; background:#000; display:flex; flex-direction:column; }
.player iframe { flex:1; width:100%; border:0; background:#000; }
.player-bar { display:flex; align-items:center; gap:8px; padding: max(8px, env(safe-area-inset-top)) 10px 10px; background:#000; flex-wrap:wrap; }
.player-bar strong { flex:1; min-width:0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player:fullscreen, .player:-webkit-full-screen { width:100vw; height:100vh; }

.panel { position:absolute; inset:0; z-index:42; background:var(--bg); display:flex; flex-direction:column; }
.themes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.theme {
  text-align:left; border:1px solid var(--line); border-radius:16px; padding:12px; background:var(--surface);
}
.theme.on { outline:2px solid var(--accent); box-shadow: 0 10px 24px color-mix(in oklab, var(--accent) 22%, transparent); }
.swatch { height:36px; border-radius:10px; margin-bottom:8px; display:flex; overflow:hidden; }
.swatch span { flex:1; }
.custom-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.custom-row label { font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:6px; }
.picker {
  display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px;
  background:var(--elevated); padding:6px 8px;
}
.picker input[type=color] { width:36px; height:28px; border:0; background:none; padding:0; cursor:pointer; }
.picker input[type=text] {
  flex:1; min-width:0; border:0; background:transparent; color:var(--fg); font-size:12px; letter-spacing:.04em; outline:none;
}
.preview-bar {
  margin-top:14px; border-radius:16px; overflow:hidden; border:1px solid var(--line);
}
.preview-bar .pv-top { padding:14px 16px; }
.preview-bar .pv-name { font-family:var(--font-display); font-size:28px; margin:0; }
.preview-bar .pv-btn { margin:12px 16px 16px; height:40px; border-radius:999px; width:calc(100% - 32px); font-weight:700; }

.tabs-lib { display:flex; gap:8px; padding:0 16px 8px; }
.empty { color:var(--muted); padding:32px 8px; font-size:14px; }

  for (const job of jobs) {
    if (job.status!=="fulfilled") continue;

}
async function colorLogo(studio){

    const d = await tmdb(path);
    const logos = d.logos || [];
    if (!logos.length) {
      studio.logoDark = /\.svg$/i.test(studio.logoPath||"");
      return studio;
    }
    const scored = logos.slice().sort((a,b)=>{
      const ap = a.file_path||"", bp = b.file_path||"";
      const asvg = /\.svg$/i.test(ap), bsvg = /\.svg$/i.test(bp);
      return (asvg-bsvg) || (b.vote_average||0)-(a.vote_average||0) || (b.width||0)-(a.width||0);
    });
    studio.logoPath = scored[0].file_path;
    studio.logoDark = /\.svg$/i.test(studio.logoPath||"");

    studio.logoDark = /\.svg$/i.test(studio.logoPath||"");

async function hydrate(reel) {

  if (!reel.trailerKey && trailerCache[cacheK]) reel.trailerKey = trailerCache[cacheK];
  const path = reel.mediaType==="tv" ? `/tv/${reel.id}` : `/movie/${reel.id}`;
  const [detailJob, videoJob] = await Promise.allSettled([
    tmdb(path, { append_to_response: "credits" }),
    tmdb(path+"/videos", { language:"en-US", include_video_language:"en,null" }),
  ]);
  const d = detailJob.status==="fulfilled" ? detailJob.value : {};
  let trailerKey = videoJob.status==="fulfilled" ? pickTrailer(videoJob.value.results) : null;
  if (!trailerKey) trailerKey = await findTrailerKey(reel.mediaType, reel.id, reel.title, reel.year);
  const companies = d.production_companies || [];
  const networks = d.networks || [];
  const studioSrc = reel.mediaType==="tv" ? (networks[0]||companies[0]) : companies[0];
  let studio = studioSrc ? { id: studioSrc.id, name: studioSrc.name, logoPath: studioSrc.logo_path||null, kind: networks[0]&&studioSrc===networks[0]?"network":"company" } : null;
  if (studio) studio = await colorLogo(studio);
  return {
    ...reel,
    overview: d.overview || reel.overview,
    runtime: d.runtime || (d.episode_run_time||[])[0] || reel.runtime,
    trailerKey,
    studio,
    cast: ((d.credits&&d.credits.cast)||[]).slice(0,8).map(c=>({id:c.id,name:c.name,character:c.character||"",profilePath:c.profile_path||null})),
    hydrated: true,
  };
}
const lanePool = {};
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function nextHotPage(lane, max=20){
  if (!lanePool[lane]) lanePool[lane] = { used:new Set() };
  const pool = lanePool[lane];
  let guard=0;
  while (guard++<40){
    const p = 1 + Math.floor(Math.random()*max);
    if (!pool.used.has(p)) { pool.used.add(p); return p; }
  }
  pool.used.clear();
  const p = 1 + Math.floor(Math.random()*max);
  pool.used.add(p);
  return p;
}
function knownTitle(r){
  if (!r.posterPath && !r.backdropPath) return false;
  const y = parseInt(r.year,10);
  if (y && (y < YEAR_MIN || y > YEAR_MAX)) return false;
  if (state.yearFilter && y && y !== state.yearFilter) return false;
  return true;
}
function dateParams(kind, year){
  const y = year || state.yearFilter;
  if (y) {
    if (kind==="movie") return { primary_release_year: y };
    return { first_air_date_year: y };
  }
  const allYears = state.lane === "foryou";
  const from = allYears ? YEAR_MIN : Math.max(YEAR_MIN, YEAR_NOW - 3);
  if (kind==="movie") return {
    "primary_release_date.gte": `${from}-01-01`,
    "primary_release_date.lte": `${YEAR_MAX}-12-31`,
  };
  return {
    "first_air_date.gte": `${from}-01-01`,
    "first_air_date.lte": `${YEAR_MAX}-12-31`,
  };
}
function sortPick(){

}
async function voteFloor(year){

async function discoverSafe(path, params){

}
async function fetchLane(lane, yearHint) {
  if (lane==="saved") return store.saved.filter(knownTitle);
  if (lane==="history") return store.history.filter(knownTitle);
  const y = state.yearFilter || yearHint || (lane==="popular" ? YEAR_NOW : null);
  const yearMax = (y && y >= YEAR_NOW) ? 8 : 20;
  const page = nextHotPage(lane + (y||"mix"), yearMax);
  const datesMovie = dateParams("movie", y);
  const datesTv = dateParams("tv", y);
  const votes = await voteFloor(y);
  const voteParam = votes > 0 ? { "vote_count.gte": votes } : {};
  let rows = [];
  try {
    if (lane==="popular") {
      const [movies, moreMovies, tv] = await Promise.all([
        discoverSafe("/discover/movie", { page, sort_by: "popularity.desc", include_adult:false, ...voteParam, ...datesMovie }),
        discoverSafe("/discover/movie", { page: Math.max(1, page-1), sort_by: "popularity.desc", include_adult:false, ...datesMovie }),
        discoverSafe("/discover/tv", { page: 1, sort_by: "popularity.desc", ...datesTv }),
      ]);
      rows = movies.map(x=>mapItem(x,"movie"))
        .concat(moreMovies.map(x=>mapItem(x,"movie")))
        .concat(tv.slice(0,8).map(x=>mapItem(x,"tv")));
      if (!rows.length) {
        const trending = await discoverSafe("/trending/movie/week", { page: 1 });
        rows = trending.map(x=>mapItem(x,"movie"));
      }
    } else if (lane==="movies") {
      let data = await discoverSafe("/discover/movie", { page, sort_by: sortPick(), include_adult:false, ...voteParam, ...datesMovie });
      if (!data.length) data = await discoverSafe("/discover/movie", { page:1, sort_by:"popularity.desc", include_adult:false, ...datesMovie });
      rows = data.map(x=>mapItem(x,"movie"));
    } else if (lane==="shows") {
      let data = await discoverSafe("/discover/tv", { page, sort_by: "popularity.desc", ...voteParam, ...datesTv });
      if (!data.length) data = await discoverSafe("/discover/tv", { page:1, sort_by:"popularity.desc", ...datesTv });
      rows = data.map(x=>mapItem(x,"tv"));
    } else if (lane==="animation") {
      const which = Math.random()>.4 ? "movie" : "tv";
      let data = await discoverSafe(`/discover/${which}`, { page, with_genres:16, sort_by:"popularity.desc", ...voteParam, ...(which==="movie"?datesMovie:datesTv) });
      if (!data.length) data = await discoverSafe("/discover/movie", { page:1, with_genres:16, sort_by:"popularity.desc", ...datesMovie });
      rows = data.map(x=>mapItem(x, data===undefined?"movie":which));
    } else if (lane==="action") {
      const which = Math.random()>.25 ? "movie" : "tv";
      let data = await discoverSafe(`/discover/${which}`, { page, with_genres:28, sort_by: sortPick(), ...voteParam, ...(which==="movie"?datesMovie:datesTv) });
      if (!data.length) data = await discoverSafe("/discover/movie", { page:1, with_genres:28, sort_by:"popularity.desc", ...datesMovie });
      rows = data.map(x=>mapItem(x, which));
    } else if (lane==="comedy") {
      const which = Math.random()>.45 ? "movie" : "tv";
      let data = await discoverSafe(`/discover/${which}`, { page, with_genres:35, sort_by:"popularity.desc", ...voteParam, ...(which==="movie"?datesMovie:datesTv) });
      if (!data.length) data = await discoverSafe("/discover/movie", { page:1, with_genres:35, sort_by:"popularity.desc", ...datesMovie });
      rows = data.map(x=>mapItem(x, which));
    } else if (lane==="horror") {
      let data = await discoverSafe("/discover/movie", { page, with_genres:27, sort_by:"popularity.desc", ...voteParam, ...datesMovie });
      if (!data.length) data = await discoverSafe("/discover/movie", { page:1, with_genres:27, sort_by:"popularity.desc", ...datesMovie });
      rows = data.map(x=>mapItem(x,"movie"));
    } else {
      const which = Math.random()>.42 ? "movie" : "tv";
      let data = await discoverSafe(`/discover/${which}`, { page, sort_by: sortPick(), ...voteParam, ...(which==="movie"?datesMovie:datesTv) });
      if (!data.length) data = await discoverSafe("/discover/movie", { page:1, sort_by:"popularity.desc" });
      rows = data.map(x=>mapItem(x, which));
    }

  if (kept.length) return shuffle(kept);

}

function resolvedMode(){

function parseHash(){
  const h = (location.hash || "").replace(/^#/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts[0]==="watch" && parts[2]) {
    return { kind:"watch", media:parts[1], id:+parts[2], s:+parts[3]||1, e:+parts[4]||1 };
  }
  if (parts[0]==="search") return { kind:"search" };
  if (parts[0]==="settings") return { kind:"settings" };
  if (parts[0]==="library") return { kind:"library" };
  if (parts[0]==="episodes") return { kind:"episodes" };
  if (parts[0]==="studio" || parts[0]==="person" || parts[0]==="info") return { kind:parts[0] };
  if (parts[0]==="lane" || parts[0]==="foryou" || LANES.some(l=>l.id===parts[0])) {
    const lane = parts[0]==="lane" ? (parts[1]||"popular") : parts[0];

const SERVER_ORDER = Object.keys(SERVERS);
let playerFailoverTimer = null;
let playerReady = false;
let failoverHops = 0;
let failoverOrigin = null;

function playSrc(r, server){
  const s = SERVERS[server || state.server] || SERVERS.vixsrc;
  return r.mediaType==="tv" ? s.tv(r.id, state.watchS, state.watchE) : s.movie(r.id);
}
function showToast(msg){
  const old = document.getElementById("bwhsToast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.id = "bwhsToast";
  el.className = "toast";
  el.textContent = msg;
  (document.getElementById("cinema") || app).appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function clearFailover(){
  if (playerFailoverTimer) { clearTimeout(playerFailoverTimer); playerFailoverTimer = null; }
}
let lastStreamKey = "";
function streamKey(){
  const r = state.watching;
  if (!r) return "";
  return [state.server, r.mediaType, r.id, state.watchS, state.watchE].join(":");
}
function loadPlayerStream(force){
  const frame = document.querySelector("#cinema iframe");
  const reel = state.watching;
  if (!frame || !reel) return;
  const key = streamKey();
  if (!force && frame.src && lastStreamKey === key) return;
  lastStreamKey = key;
  playerReady = false;
  clearFailover();
  frame.removeAttribute("sandbox");
  frame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
  frame.setAttribute("allowfullscreen", "true");
  frame.setAttribute("referrerpolicy", "no-referrer");
  const markReady = () => {
    playerReady = true;
    clearFailover();
    failoverHops = 0;
  };
  frame.onload = markReady;
  frame.onerror = () => { if (!playerReady) autoFailoverPlayer(); };
  frame.src = playSrc(reel);
  playerFailoverTimer = setTimeout(() => {
    if (!playerReady && state.watching) autoFailoverPlayer();
  }, 9000);
}
function autoFailoverPlayer(){
  if (!state.watching) return;
  const keys = SERVER_ORDER;
  const cur = Math.max(0, keys.indexOf(state.server));
  if (failoverOrigin == null) failoverOrigin = cur;
  const next = (cur + 1) % keys.length;
  failoverHops += 1;
  if (failoverHops >= keys.length) {
    clearFailover();
    showToast("All sources stalled — pick a server");
    return;
  }
  state.server = keys[next];
  localStorage.setItem("bwhs-server", state.server);
  const toggle = document.getElementById("svrToggle");
  if (toggle) toggle.textContent = (SERVERS[state.server]||SERVERS.vixsrc).label + " ▾";
  document.querySelectorAll("[data-server]").forEach(x=>x.classList.toggle("on", x.dataset.server===state.server));
  showToast("Switching source to " + (SERVERS[state.server]||{}).label);
  loadPlayerStream();
}
function playerHTML(r){
  const seLabel = r.mediaType==="tv" ? ` [S${String(state.watchS).padStart(2,"0")}E${String(state.watchE).padStart(2,"0")}]` : "";

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function escAttr(s){ return esc(s); }

function isPhone(){

function ytCommand(func, frame){
  const frames = frame ? [frame] : document.querySelectorAll(".trailer-cover iframe");
  frames.forEach(f=>{
    try { f.contentWindow?.postMessage(JSON.stringify({event:"command",func,args:[]}),"*"); } catch {}
  });
}
function slideKey(r){ return r ? r.mediaType+"-"+r.id : ""; }

function killAllTrailers(exceptI){
  document.querySelectorAll(".slide").forEach(slide=>{
    const i = +slide.dataset.i;
    if (i===exceptI) return;
    const slot = slide.querySelector(".trailer-slot");
    const frame = slot && slot.querySelector("iframe");
    if (frame) {
      try { ytCommand("stopVideo", frame); ytCommand("pauseVideo", frame); } catch {}
      slot.innerHTML = "";
    }
  });
}

window.addEventListener("message", (e)=>{
  const data = e.data;
  let msg = data;
  try { if (typeof data === "string" && data.charAt(0)==="{") msg = JSON.parse(data); } catch { return; }
  if (!msg || typeof msg !== "object") return;
  const info = msg.info;
  const state = (msg.event === "onStateChange") ? (msg.info ?? msg.data) : (typeof info === "number" ? info : info?.playerState);
  if (state === 1) {
    document.querySelectorAll(".trailer-cover").forEach(c=>c.classList.add("ready"));
  }
});

function syncTrailers(){
  const allow = !state.watching && (state.overlay==="none" || state.overlay==="synopsis") && !state.epPick;
  const activeI = state.active;
  const r = state.items[activeI];
  killAllTrailers(allow && r && r.trailerKey ? activeI : -1);
  document.querySelectorAll(".slide").forEach(slide=>{
    const i = +slide.dataset.i;
    const item = state.items[i];
    const slot = slide.querySelector(".trailer-slot");
    if (!slot || !item) return;
    const shouldPlay = allow && i===activeI && item.trailerKey;
    const existing = slot.querySelector("iframe");
    if (shouldPlay) {
      if (!existing || existing.dataset.key!==item.trailerKey) {
        slot.innerHTML = `<div class="trailer-cover"><iframe data-key="${item.trailerKey}" src="${ytEmbed(item.trailerKey, store.muted)}" allow="autoplay; encrypted-media" tabindex="-1" title="trailer"></iframe></div>`;
        const cover = slot.querySelector(".trailer-cover");
        const frame = slot.querySelector("iframe");
        const reveal = ()=> cover && cover.classList.add("ready");
        setTimeout(reveal, 2800);
        if (frame) {
          frame.setAttribute("style", "pointer-events:none");
          frame.onload = ()=>{
            try {
              frame.contentWindow?.postMessage(JSON.stringify({event:"command",func:"playVideo",args:[]}), "*");
              frame.contentWindow?.postMessage(JSON.stringify({event:"command",func: store.muted?"mute":"unMute", args:[]}), "*");
            } catch {}
          };
        }
      } else {
        ytCommand("playVideo", existing);
        ytCommand(store.muted?"mute":"unMute", existing);
      }
      const img = slide.querySelector("img.bg");
      if (img && item.backdropPath && !img.src.includes("w1280")) img.src = IMG.backdropHd + item.backdropPath;
    } else if (existing) {
      ytCommand("pauseVideo", existing);
      ytCommand("stopVideo", existing);
      slot.innerHTML = "";
    }
  });
}

function shareUrl(reel){
  if (!reel) return SITE;
  if (reel.mediaType==="tv") return `${SITE}/#/watch/tv/${reel.id}/${reel.lastSE?.s||1}/${reel.lastSE?.e||1}`;
  return `${SITE}/#/watch/movie/${reel.id}`;
}
async function shareReel(reel){
  if (!reel) return;
  const art = reel.posterPath ? IMG.poster+reel.posterPath : (reel.backdropPath ? IMG.backdropHd+reel.backdropPath : "");
  const url = shareUrl(reel);
  const text = `Watch ${reel.title}${reel.year?" ("+reel.year+")":""} on BWHS Reels\n${url}`;
  const payload = { title: `${reel.title} · BWHS Reels`, text, url };
  try {
    if (navigator.share) {
      if (art && navigator.canShare) {
        try {
          const res = await fetch(art);
          const blob = await res.blob();
          const file = new File([blob], `${reel.title.replace(/[^\w]+/g,"_")}.jpg`, { type: blob.type || "image/jpeg" });
          if (navigator.canShare({ files:[file] })) {
            await navigator.share({ ...payload, files:[file] });
            return;
          }
        } catch {}
      }
      await navigator.share(payload);
      return;
    }
  } catch {}
  try {
    await navigator.clipboard.writeText(text);
    alert("Link copied");
  } catch {
    prompt("Copy share text", text);
  }
}

function fsEl(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
}
async function enterLandscape(node){
  const el = node || document.getElementById("cinema");
  if (!el) return;
  try {
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) await req.call(el);
  } catch {
    try { await document.documentElement.requestFullscreen?.(); } catch {}
  }
  try { await screen.orientation?.lock?.("landscape"); } catch {}
}
async function exitCinemaFs(){
  try {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit && fsEl()) await exit.call(document);
  } catch {}
  try { screen.orientation?.unlock?.(); } catch {}
}
function toggleCinemaFs(){
  const el = document.getElementById("cinema");
  if (!el) return;
  if (fsEl()) exitCinemaFs();
  else enterLandscape(el);
}

function closeEpSheet(then){

  sheet.classList.add("out");

}

function handleDeviceBack(){
  if (state.previewOpen) { state.previewOpen=false; render({overlayOnly:true}); history.pushState({app:true}, "", routeHash()); return true; }
  if (state.yearOpen) { state.yearOpen=false; render(); history.pushState({app:true}, "", routeHash()); return true; }
  if (state.genreOpen) { state.genreOpen=false; render(); history.pushState({app:true}, "", routeHash()); return true; }
  if (state.epPick) { closeEpSheet(); history.pushState({app:true}, "", routeHash()); return true; }
  if (state.watching) {
    state.watching=null;
    clearFailover();
    playerReady=false;
    failoverHops=0;
    failoverOrigin=null;
    exitCinemaFs();
    render();
    requestAnimationFrame(()=>syncTrailers());
    history.pushState({app:true}, "", routeHash());
    return true;
  }
  if (state.overlay!=="none") {
    clearOverlay();
    history.pushState({app:true}, "", routeHash());
    return true;
  }
  history.pushState({app:true, home:true}, "", routeHash());
  return true;
}

function toggleTrailerPause(i){
  if (i!==state.active) return;
  const r = state.items[i];
  if (!r || !r.trailerKey) return;
  const k = slideKey(r);
  state.paused[k] = !state.paused[k];
  const slide = document.querySelector(`.slide[data-i="${i}"]`);
  const cover = slide?.querySelector(".trailer-cover");
  const frame = slide?.querySelector("iframe");
  if (state.paused[k]) {
    if (cover) cover.classList.remove("ready");
    if (frame) frame.style.opacity = "0";
  } else {
    if (frame) {
      frame.style.opacity = "";
      ytCommand("playVideo", frame);
      ytCommand(store.muted?"mute":"unMute", frame);
    }
    if (cover) cover.classList.add("ready");
  }
}

  document.querySelectorAll("[data-mute]").forEach(b=>b.addEventListener("click", ()=>{
    store.muted=!store.muted; persistPrefs();
    document.querySelectorAll("[data-mute]").forEach(btn=>{
      btn.querySelector("i").innerHTML = store.muted?icon("mute"):icon("vol");
      btn.querySelector("span").textContent = store.muted?"Muted":"Sound";
    });
    ytCommand(store.muted?"mute":"unMute");
  }));
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click", ()=>{ state.synopsis=state.items[+b.dataset.open]; state.overlay="synopsis"; render(); }));
  document.querySelectorAll("[data-open-title]").forEach(b=>b.addEventListener("click", ()=>{
    const reel = JSON.parse(b.getAttribute("data-open-title"));
    openReelPreview(reel);
  }));
  document.querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click", ()=>openPerson(JSON.parse(b.getAttribute("data-person")))));
  document.querySelectorAll("[data-studio]").forEach(b=>b.addEventListener("click", ()=>{
    const s = JSON.parse(b.getAttribute("data-studio")); if(s&&s.id) openStudio(s);
  }));
  document.querySelectorAll("[data-theme]").forEach(b=>b.addEventListener("click", ()=>{ store.palette=b.dataset.theme; applyTheme(); paintThemeChrome(); }));
  document.querySelectorAll("[data-palette]").forEach(b=>b.addEventListener("click", ()=>{
    store.palette = b.dataset.palette;
    applyTheme();
    paintThemeChrome();
  }));
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click", ()=>{
    store.mode = b.dataset.mode;
    applyTheme();
    paintThemeChrome();
  }));
  $("#openPreview")?.addEventListener("click", ()=>{ state.previewOpen = true; render({overlayOnly:true}); });
  $("#closePreview")?.addEventListener("click", ()=>{ state.previewOpen = false; render({overlayOnly:true}); });
  $("#applyPreview")?.addEventListener("click", ()=>{ state.previewOpen = false; applyTheme(); render({overlayOnly:true}); });
  $("#themePreview")?.addEventListener("click", e=>{ if (e.target.id==="themePreview") { state.previewOpen=false; render({overlayOnly:true}); } });
  document.querySelectorAll("[data-lib]").forEach(b=>b.addEventListener("click", ()=>{ state.libTab=b.dataset.lib; render(); }));
  document.querySelectorAll("[data-catfilter]").forEach(b=>b.addEventListener("click", ()=>{
    if (!state.catalog) return;
    state.catalog.filter = b.dataset.catfilter;
    render();
  }));
  document.querySelectorAll("[data-save-item]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const reel = JSON.parse(b.getAttribute("data-save-item"));
    toggleSaved(reel);
    b.classList.toggle("on", isSaved(reel));
  }));
  $("#keyTip")?.addEventListener("click", ()=>{
    localStorage.setItem("bwhs-keys-tip","1");
    $("#keyTip")?.remove();
  });
  $("#catBody")?.addEventListener("scroll", ()=>{
    const el = $("#catBody");
    if (!el || !state.catalog?.more || state.catalog._loading) return;
    if (el.scrollTop + el.clientHeight > el.scrollHeight - 400) loadCatalogMore();
  }, {passive:true});
  document.querySelectorAll("[data-recent]").forEach(b=>b.addEventListener("click", ()=>{ state.searchQ=b.dataset.recent; runSearch(state.searchQ); }));
  $("#clearSearches")?.addEventListener("click", ()=>{ store.searches=[]; persistLists(); render(); });
  $("#synWatch")?.addEventListener("click", ()=>openWatch(state.synopsis));
  document.querySelectorAll("[data-ckey]").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const k=e.target.dataset.ckey;
      store.custom[k]=e.target.value;
      store.palette="custom";
      applyTheme();
      paintThemeChrome();
    });
  });
  document.querySelectorAll("[data-tkey]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const v=e.target.value.trim();
      if(!/^#([0-9a-fA-F]{6})$/.test(v)) return;
      store.custom[e.target.dataset.tkey]=v.toLowerCase();
      store.palette="custom";
      applyTheme();
      paintThemeChrome();
    });
  });
  const q = $("#q");
  if (q){
    q.addEventListener("input", e=>{
      state.searchQ=e.target.value;
      clearTimeout(window.__qs);
      window.__qs=setTimeout(()=>runSearch(state.searchQ), 260);
    });
    q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ addSearch(state.searchQ); persistLists(); }});
    requestAnimationFrame(()=>{ q.focus(); const n=q.value.length; try{ q.setSelectionRange(n,n);}catch{} });
  }
  bindSearchHits();
  const feed = $("#feed");
  if (feed){
    feed.addEventListener("scroll", onScroll, {passive:true});
    if (state.restoreY) feed.scrollTop = state.restoreY;
  }
}

function onScroll(e){
  const el=e.target;
  state.restoreY=el.scrollTop;
  const i = Math.round(el.scrollTop / el.clientHeight);
  if (i!==state.active && state.items[i]) {
    state.active=i;
    document.querySelectorAll(".slide").forEach((s,idx)=>s.classList.toggle("active", idx===i));
    syncTrailers();
    hydrateAround(i);
    if (i > state.items.length-4) loadMore();
  }
}

async function hydrateAround(i){
  const start = Math.max(0,i-1);
  const slice = state.items.slice(start, i+8);
  await Promise.all(slice.map(async (item, idx)=>{
    const pos = start+idx;
    const real = state.items[pos];
    if (!real || (real.hydrated && real.trailerKey)) return;
    try {
      const next = await hydrate(real);
      state.items[pos]=next;
      const slide = document.querySelector(`.slide[data-i="${pos}"]`);
      if (slide && next.cast?.length) {
        const row = slide.querySelector(".cast-row");
        if (row) row.innerHTML = next.cast.slice(0,6).map(p=>`<button class="cast" data-person='${escAttr(JSON.stringify(p))}'>
          ${p.profilePath?`<img src="${IMG.profile+p.profilePath}" alt="">`:`<span class="ph">${esc(p.name[0]||"?")}</span>`}
          <span>${esc(p.name)}</span>
        </button>`).join("");
        row.querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click", ()=>openPerson(JSON.parse(b.getAttribute("data-person")))));
      }
      if (slide && next.studio) {
        const st = slide.querySelector(".studio");
        if (st) {
          st.disabled = false;
          st.setAttribute("data-studio", JSON.stringify(next.studio));
          st.querySelector("small").textContent = next.studio.name;
          const mark = st.querySelector(".mark");
          if (mark && next.studio.logoPath) {
            mark.classList.toggle("dark", !!next.studio.logoDark);
            mark.innerHTML = `<img src="${IMG.logo+next.studio.logoPath}" alt="">`;
          }
        }
      }
    } catch { if (real) real.hydrated=true; }
  }));
  syncTrailers();
}

async function loadLane(id){
  state.lane=id; state.boot=true; state.page=1; state.active=0; state.overlay="none"; state.items=[]; state.paused={}; state.yearOpen=false; state.genreOpen=false;
  render({rebuildFeed:true, force:true});
  try {
    let years;
    if (state.yearFilter) {
      years = [state.yearFilter, state.yearFilter, state.yearFilter];
    } else if (id === "foryou") {
      years = shuffle(ALL_YEARS.slice()).slice(0, 8);
    } else if (id === "popular") {
      years = [YEAR_NOW, YEAR_NOW, YEAR_NOW];
    } else {
      years = [null, null, null];
    }
    const batches = await Promise.all(years.map(y => fetchLane(id, y)));
    const seen = new Set();
    state.items = [];
    const stacked = id === "foryou" ? shuffle(batches.flat()) : batches.flat();
    for (const r of stacked) {
      const k=r.mediaType+r.id;
      if (seen.has(k)) continue;
      seen.add(k); state.items.push(r);
    }
    if (!state.items.length && id !== "saved" && id !== "history") {
      const fallbacks = await Promise.all([
        discoverSafe("/movie/popular", { page:1 }),
        discoverSafe("/trending/movie/week", { page:1 }),
        discoverSafe("/movie/now_playing", { page:1 }),
        discoverSafe("/movie/upcoming", { page:1 }),
      ]);
      for (const r of fallbacks.flat().map(x=>mapItem(x,"movie"))) {
        const k=r.mediaType+r.id;
        if (seen.has(k)) continue;
        if (!r.posterPath && !r.backdropPath) continue;
        seen.add(k); state.items.push(r);
      }
    }
    if (id !== "foryou" && id !== "saved" && id !== "history") {
      state.items.sort((a,b)=> (b.popularity||0) - (a.popularity||0));
    }
  } catch(e){
    try {
      const trending = await discoverSafe("/trending/movie/week", { page:1 });
      state.items = trending.map(x=>mapItem(x,"movie")).filter(r=>r.posterPath||r.backdropPath);
    } catch { state.items = []; }
  }
  state.boot=false;
  render({rebuildFeed:true, force:true});
  if (state.items.length) hydrateAround(0);
}

async function loadMore(){
  if (state.lane==="saved"||state.lane==="history"||state._more) return;
  state._more=true;
  try {
    const y = state.yearFilter || (state.lane==="foryou" ? ALL_YEARS[Math.floor(Math.random()*ALL_YEARS.length)] : state.lane==="popular" ? YEAR_NOW : null);
    const next = await fetchLane(state.lane, y);
    const seen = new Set(state.items.map(x=>x.mediaType+x.id));
    const add = next.filter(x=>!seen.has(x.mediaType+x.id));
    const start = state.items.length;
    state.items = state.items.concat(add);
    const feed = $("#feed");
    if (feed && add.length) {
      add.forEach((r,i)=> feed.insertAdjacentHTML("beforeend", slideHTML(r, start+i)));
      bindNewSlides(start);
    }
  } catch {}
  state._more=false;
}
function bindNewSlides(from){
  document.querySelectorAll("[data-watch]").forEach(b=>{
    if (+b.dataset.watch>=from) b.addEventListener("click", ()=>openWatch(state.items[+b.dataset.watch]));
  });
  document.querySelectorAll("[data-save]").forEach(b=>{
    if (+b.dataset.save>=from) b.addEventListener("click", ()=>{
      toggleSaved(state.items[+b.dataset.save]);
      b.classList.toggle("saved", isSaved(state.items[+b.dataset.save]));
      b.querySelector("span").textContent = isSaved(state.items[+b.dataset.save])?"Saved":"Save";
    });
  });
  document.querySelectorAll("[data-share]").forEach(b=>{
    if (+b.dataset.share>=from) b.addEventListener("click", e=>{ e.stopPropagation(); shareReel(state.items[+b.dataset.share]); });
  });
  document.querySelectorAll("[data-toggle-trailer]").forEach(b=>{
    if (+b.dataset.toggleTrailer>=from) b.addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation();
      toggleTrailerPause(+b.dataset.toggleTrailer);
    });
  });
  document.querySelectorAll("[data-open]").forEach(b=>{
    if (+b.dataset.open>=from) b.addEventListener("click", ()=>{ state.synopsis=state.items[+b.dataset.open]; state.overlay="synopsis"; render(); });
  });
  document.querySelectorAll("[data-eps]").forEach(b=>{
    if (+b.dataset.eps>=from) b.addEventListener("click", e=>{ e.stopPropagation(); openEpisodes(state.items[+b.dataset.eps]); });
  });
}

async function runSearch(q){
  const t=q.trim();
  state.searchQ=q;
  if(!t){ state.searchTitles=[]; state.searchPeople=[]; state.searchBusy=false; paintSearchResults(); return; }
  state.searchBusy=true;
  paintSearchResults();
  const token = (window.__searchTok = (window.__searchTok||0)+1);
  try {
    const [media, people] = await Promise.all([
      tmdb("/search/multi",{query:t}),
      tmdb("/search/person",{query:t}),
    ]);
    if (token !== window.__searchTok) return;
    state.searchTitles = (media.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv").map(x=>mapItem(x,x.media_type));
    state.searchPeople = (people.results||[]).slice(0,12).map(p=>({id:p.id,name:p.name,profilePath:p.profile_path||null}));
    addSearch(t);
  } catch { if (token === window.__searchTok) { state.searchTitles=[]; state.searchPeople=[]; } }
  if (token !== window.__searchTok) return;
  state.searchBusy=false;
  paintSearchResults();
}

function openReelPreview(reel){
  if (!reel) return;
  state.overlay="none";
  state.watching=null;
  state.epPick=null;
  state.posterView=null;
  state.yearOpen=false;
  const k = reel.mediaType+"-"+reel.id;
  let idx = state.items.findIndex(x => x.mediaType+"-"+x.id === k);
  if (idx < 0) {
    state.items = [reel, ...state.items];
    idx = 0;
  }
  state.active = idx;
  render();
  const feed = $("#feed");
  if (feed) feed.scrollTop = idx * (feed.clientHeight || window.innerHeight);
  hydrateAround(idx);
}
function openWatch(reel){
  if(!reel) return;
  addHistory(reel);
  state.watching=reel; state.overlay="none"; state.epPick=null;
  if (reel.mediaType==="tv") {
    if (reel.lastSE) { state.watchS=reel.lastSE.s; state.watchE=reel.lastSE.e; }
    loadSeasons(reel);
  }
  failoverHops = 0;
  failoverOrigin = SERVER_ORDER.indexOf(state.server);
  render();
  const cinema = document.getElementById("cinema");
  if (store.autoFs && isPhone() && cinema) enterLandscape(cinema);
}
async function loadSeasons(reel){
  const key="tv-"+reel.id;
  if (state.seasons[key]) return state.seasons[key];
  try {
    const d = await tmdb(`/tv/${reel.id}`);
    state.seasons[key] = (d.seasons||[]).filter(s=>s.season_number>0 && s.episode_count>0)
      .map(s=>({n:s.season_number, count:s.episode_count, name:s.name}));
    if (!state.watchS) state.watchS = state.seasons[key][0]?.n || 1;
    await loadEpisodes(reel, state.watchS);
  } catch { state.seasons[key]=[]; }
  return state.seasons[key];
}
async function loadEpisodes(reel, season){
  const key="tv-"+reel.id+"-"+season;
  if (state.episodes[key]) return state.episodes[key];
  try {
    const d = await tmdb(`/tv/${reel.id}/season/${season}`);
    state.episodes[key] = (d.episodes||[]).map(e=>({n:e.episode_number, name:e.name||""}));
  } catch { state.episodes[key]=[]; }
  return state.episodes[key];
}
async function openEpisodes(reel){
  if (!reel || reel.mediaType!=="tv") return;
  state.epPick = reel;
  if (reel.lastSE) { state.watchS=reel.lastSE.s; state.watchE=reel.lastSE.e; }
  render();
  await loadSeasons(reel);
  await loadEpisodes(reel, state.watchS);
  render();
}

async function openPerson(p){
  state.overlay="person";
  state.catalog={
    mode:"person", title:p.name, items:[], filter:"all", more:false,
    image: p.profilePath ? IMG.profile+p.profilePath : null
  };
  render({overlayOnly:true});
  try {
    const d = await tmdb(`/person/${p.id}/combined_credits`);
    const seen = new Set();
    const list = [];
    for (const x of (d.cast||[]).concat(d.crew||[])) {
      const type = x.media_type==="tv"?"tv":"movie";
      const k = type+x.id;
      if (seen.has(k)) continue;
      seen.add(k);
      list.push(mapItem(x, type));
    }
    list.sort((a,b)=>(b.year||"0").localeCompare(a.year||"0"));
    state.catalog.items = list.filter(knownTitle);
  } catch {}
  render({overlayOnly:true});
}
async function openStudio(s){
  state.overlay="studio";
  state.catalog={
    mode:"studio", title:s.name, studio:s, items:[], filter:"all", more:true,
    pageMovie:1, pageTv:1, moreMovie:true, moreTv:true,
    image: s.logoPath ? IMG.logo+s.logoPath : null
  };
  render();
  await loadCatalogMore();
  await loadCatalogMore();
  await loadCatalogMore();
}
async function loadCatalogMore(){
  const c = state.catalog;
  if (!c || c.mode!=="studio" || c._loading) return;
  c._loading = true;
  const s = c.studio;
  const company = s.kind!=="network";
  const jobs = [];
  if (c.moreMovie) jobs.push(tmdb("/discover/movie", { page:c.pageMovie, sort_by:"popularity.desc", with_companies:s.id, "primary_release_date.gte":`${YEAR_MIN}-01-01` }).then(d=>{
    c.pageMovie += 1;
    c.moreMovie = (d.page||1) < (d.total_pages||1) && c.pageMovie <= 500;
    return (d.results||[]).map(x=>mapItem(x,"movie"));
  }).catch(()=>{ c.moreMovie=false; return []; }));
  if (c.moreTv) jobs.push(tmdb("/discover/tv", { page:c.pageTv, sort_by:"popularity.desc", [company?"with_companies":"with_networks"]:s.id, "first_air_date.gte":`${YEAR_MIN}-01-01` }).then(d=>{
    c.pageTv += 1;
    c.moreTv = (d.page||1) < (d.total_pages||1) && c.pageTv <= 500;
    return (d.results||[]).map(x=>mapItem(x,"tv"));
  }).catch(()=>{ c.moreTv=false; return []; }));
  const chunks = await Promise.all(jobs);
  const seen = new Set(c.items.map(x=>x.mediaType+x.id));
  chunks.flat().forEach(x=>{
    const k=x.mediaType+x.id;
    if (!seen.has(k)) { seen.add(k); c.items.push(x); }
  });
  c.more = c.moreMovie || c.moreTv;
  c._loading = false;
  const grid = document.querySelector("#catBody .grid");
  if (grid) {
    const existing = new Set([...grid.querySelectorAll("[data-open-title]")].map(b=>{
      try { const t=JSON.parse(b.getAttribute("data-open-title")); return t.mediaType+t.id; } catch { return ""; }
    }));
    const add = c.items.filter(t=>!existing.has(t.mediaType+t.id));
    add.forEach(t=> grid.insertAdjacentHTML("beforeend", posterCard(t)));
    grid.querySelectorAll("[data-open-title]").forEach(b=>{
      if (b.dataset.bound) return;
      b.dataset.bound = "1";
      b.addEventListener("click", ()=>{
        const reel = JSON.parse(b.getAttribute("data-open-title"));
        clearOverlay();
        openReelPreview(reel);
      });
    });
    grid.querySelectorAll("[data-save-item]").forEach(b=>{
      if (b.dataset.bound) return;
      b.dataset.bound = "1";
      b.addEventListener("click", e=>{
        e.stopPropagation();
        const reel = JSON.parse(b.getAttribute("data-save-item"));
        toggleSaved(reel);
        b.classList.toggle("on", isSaved(reel));
      });
    });
    return;
  }
  const y = state.catalog?._scroll || 0;
  render({overlayOnly:true});
  requestAnimationFrame(()=>{ const body=document.getElementById("catBody"); if (body) body.scrollTop = y; });
}

applyTheme();
if (store.mode==="auto") setInterval(()=>applyTheme(), 10*60*1000);
window.addEventListener("keydown", e=>{
  if (state.overlay!=="none" || state.watching || state.epPick) return;
  if (e.key!=="ArrowDown" && e.key!=="ArrowUp") return;
  e.preventDefault();
  localStorage.setItem("bwhs-keys-tip","1");
  $("#keyTip")?.remove();
  const feed = $("#feed");
  if (!feed) return;
  const next = e.key==="ArrowDown" ? Math.min(state.active+1, state.items.length-1) : Math.max(state.active-1, 0);
  feed.scrollTo({ top: next * feed.clientHeight, behavior:"smooth" });
});
window.addEventListener("popstate", ()=>{
  handleDeviceBack();
});
const bootRoute = parseHash();
if (bootRoute.kind==="lane") {
  if (LANES.some(l=>l.id===bootRoute.lane)) state.lane = bootRoute.lane;
  if (bootRoute.year) state.yearFilter = bootRoute.year;
}
seedHomeHash();
render();
loadLane(state.lane);
</script>
