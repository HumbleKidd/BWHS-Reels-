<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#07070a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>BWHS Reels</title>
<link rel="preconnect" href="https://api.themoviedb.org" />
<link rel="preconnect" href="https://image.tmdb.org" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --font-sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Instrument Serif", Georgia, serif;
  --bg: #07070a; --surface: #121216; --elevated: #1c1c22; --fg: #f3f1ec;
  --muted: #9a9892; --subtle: #6e6c67; --accent: #ece8e0; --accent-fg: #0c0c0e;
  --line: color-mix(in oklab, var(--fg) 14%, transparent);
  --glow: rgba(236,232,224,.18);
  --radius: 16px;
}
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:var(--font-sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
* { box-sizing:border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
img { max-width:100%; display:block; }
.app { height:100dvh; position:relative; background:var(--bg); color:var(--fg); }
.font-display { font-family: var(--font-display); }

header.top {
  position:absolute; left:0; right:0; z-index:20; padding: max(.7rem, env(safe-area-inset-top)) 14px 0;
  background: linear-gradient(to bottom, color-mix(in oklab, var(--bg) 88%, transparent), transparent);
  pointer-events:none;
}
header.top > * { pointer-events:auto; }
.brand-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand {
  display:flex; align-items:baseline; gap:8px; filter: drop-shadow(0 6px 18px var(--glow));
}
.brand h1 {
  margin:0; font-family:var(--font-display); font-size: clamp(2rem, 7vw, 2.6rem);
  letter-spacing:-.045em; line-height:.9;
  background: linear-gradient(120deg, var(--fg) 10%, var(--accent) 45%, #fff 55%, var(--fg) 90%);
  background-size: 220% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation: shine 7s ease-in-out infinite;
}
.brand em { font-style:italic; font-size:.42em; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); opacity:.85; margin-left:2px; }
@keyframes shine { 0%,70%{background-position:0% 50%} 85%{background-position:100% 50%} 100%{background-position:0% 50%} }

.icon-btn {
  width:42px; height:42px; border-radius:999px; border:1px solid var(--line);
  background: color-mix(in oklab, var(--elevated) 80%, transparent);
  display:grid; place-items:center; backdrop-filter: blur(10px);
}
.icon-btn:active { transform: scale(.96); }
.tools { display:flex; gap:8px; align-items:center; }
.pill-auto {
  display:flex; align-items:center; gap:8px; height:42px; padding:0 12px; border-radius:999px;
  border:1px solid var(--line); background: color-mix(in oklab, var(--elevated) 80%, transparent);
  font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.switch { width:34px; height:20px; border-radius:999px; background:var(--elevated); border:1px solid var(--line); position:relative; }
.switch.on { background:var(--accent); }
.switch i { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--fg); transition: transform .18s; }
.switch.on i { transform: translateX(14px); background:var(--accent-fg); }

.lanes { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:6px; scrollbar-width:none; }
.lanes::-webkit-scrollbar { display:none; }
.lane {
  height:32px; padding:0 12px; border-radius:999px; white-space:nowrap; font-size:12px; font-weight:600;
  background: color-mix(in oklab, var(--elevated) 80%, transparent); color:var(--muted);
}
.lane.on { background:var(--fg); color:var(--bg); }

.feed { height:100dvh; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; }
.feed::-webkit-scrollbar { display:none; }
.slide { height:100dvh; scroll-snap-align:start; position:relative; overflow:hidden; }
.stage { position:absolute; inset:0; }
.slide img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.06); }
.slide.active img.bg { animation: ken 22s linear alternate infinite; }
.trailer-cover { position:absolute; inset:0; overflow:hidden; background:#000; }
.trailer-cover iframe {
  position:absolute; top:50%; left:50%; border:0;
  height:100%; width:177.78%; min-width:100%; min-height:56.25vw;
  transform:translate(-50%,-50%); pointer-events:none;
}
@keyframes ken { from{transform:scale(1.06)} to{transform:scale(1.16)} }
.veil { position:absolute; inset:0; background:
  linear-gradient(to top, color-mix(in oklab, var(--bg) 92%, transparent) 0%, transparent 42%),
  linear-gradient(to right, color-mix(in oklab, var(--bg) 55%, transparent), transparent 40%);
}
.meta { position:absolute; left:16px; right:92px; bottom: max(22px, calc(env(safe-area-inset-bottom) + 14px)); }
.kicker { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
.meta h2 { margin:0 0 8px; font-family:var(--font-display); font-size: clamp(1.7rem, 6vw, 2.4rem); line-height:.95; letter-spacing:-.03em; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
.ep-chip {
  font-family:var(--font-sans); font-size:11px; font-weight:700; letter-spacing:.08em;
  padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background: color-mix(in oklab, var(--elevated) 75%, transparent); color:var(--accent);
}
.meta p { margin:0; color:var(--muted); font-size:13px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.cast-row { display:flex; gap:10px; overflow-x:auto; margin-top:12px; scrollbar-width:none; }
.cast-row::-webkit-scrollbar{display:none}
.cast { width:58px; flex:none; text-align:center; }
.cast img, .cast .ph { width:46px; height:46px; border-radius:50%; object-fit:cover; margin:0 auto 4px; background:var(--elevated); display:grid; place-items:center; font-size:14px; }
.cast span { font-size:10px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.rail { position:absolute; right:10px; bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px)); display:flex; flex-direction:column; align-items:center; gap:12px; }
.rail .studio { display:flex; flex-direction:column; align-items:center; gap:6px; width:72px; }
.studio .mark { width:48px; height:48px; border-radius:50%; background:var(--fg); color:var(--bg); display:grid; place-items:center; overflow:hidden; border:1px solid var(--line); }
.studio .mark img { max-width:36px; max-height:28px; object-fit:contain; }
.studio small { font-size:10px; color:var(--muted); width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.play {
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-fg);
  display:grid; place-items:center; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.play:active { transform:scale(.96); }
.play-lab { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-top:4px; }
.rbtn { display:flex; flex-direction:column; align-items:center; gap:4px; }
.rbtn i { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background: color-mix(in oklab, var(--elevated) 70%, transparent); display:grid; place-items:center; backdrop-filter:blur(8px); }
.rbtn span { font-size:10px; color:var(--muted); }
.saved i { color: #ff6b7a; }

.boot { position:absolute; inset:0; display:grid; place-items:center; z-index:5; }
.boot .logo { font-family:var(--font-display); font-size:3.2rem; letter-spacing:-.04em; }
.spin { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:12px auto 0; }
@keyframes spin { to { transform:rotate(360deg) } }

.overlay { position:absolute; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; }
.ov-head { display:flex; align-items:center; gap:8px; padding: max(.7rem, env(safe-area-inset-top)) 12px 12px; }
.ov-head h3 { margin:0; font-size:16px; font-weight:700; }
.search-wrap { position:relative; flex:1; }
.search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.55; }
.search-wrap input {
  width:100%; height:44px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--fg); padding:0 14px 0 40px; outline:none;
}
.ov-body { flex:1; overflow:auto; padding: 4px 16px 32px; }
.sec { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:16px 0 8px; }
.row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:8px; border-radius:16px; }
.row:hover { background: color-mix(in oklab, var(--elevated) 60%, transparent); }
.row img, .row .ph { width:48px; height:72px; border-radius:8px; object-fit:cover; background:var(--elevated); flex:none; }
.chip { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); margin:0 6px 8px 0; font-size:13px; }
.people { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
.grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
.card { text-align:left; }
.card img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:12px; background:var(--elevated); }
.card b { display:block; margin-top:6px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card small { color:var(--muted); font-size:11px; }

.sheet {
  position:absolute; left:0; right:0; bottom:0; z-index:45;
  background: color-mix(in oklab, var(--surface) 94%, transparent);
  backdrop-filter: blur(18px); border-top:1px solid var(--line);
  border-radius: 24px 24px 0 0; padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
  max-height: 72dvh; overflow:auto;
}
.sheet h2 { font-family:var(--font-display); font-size:1.8rem; margin:0 0 8px; }
.cta { height:48px; border-radius:999px; background:var(--accent); color:var(--accent-fg); font-weight:700; padding:0 22px; }

.player { position:absolute; inset:0; z-index:50; background:#000; display:flex; flex-direction:column; }
.player iframe { flex:1; width:100%; border:0; background:#000; }
.player-bar { display:flex; align-items:center; gap:10px; padding: max(8px, env(safe-area-inset-top)) 12px 10px; background:#000; }
.player-bar strong { flex:1; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player:fullscreen, .player:-webkit-full-screen { width:100vw; height:100vh; }

.panel { position:absolute; inset:0; z-index:42; background:var(--bg); display:flex; flex-direction:column; }
.themes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.theme {
  text-align:left; border:1px solid var(--line); border-radius:16px; padding:12px; background:var(--surface);
}
.theme.on { outline:2px solid var(--accent); }
.swatch { height:36px; border-radius:10px; margin-bottom:8px; display:flex; overflow:hidden; }
.swatch span { flex:1; }
.custom-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.custom-row label { font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:6px; }
.picker {
  display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px;
  background:var(--elevated); padding:6px 8px;
}
.picker input[type=color] { width:36px; height:28px; border:0; background:none; padding:0; cursor:pointer; }
.picker input[type=text] {
  flex:1; min-width:0; border:0; background:transparent; color:var(--fg); font-size:12px; letter-spacing:.04em; outline:none;
}
.preview-bar {
  margin-top:14px; border-radius:16px; overflow:hidden; border:1px solid var(--line);
}
.preview-bar .pv-top { padding:14px 16px; }
.preview-bar .pv-name { font-family:var(--font-display); font-size:28px; margin:0; }
.preview-bar .pv-btn { margin:12px 16px 16px; height:40px; border-radius:999px; width:calc(100% - 32px); font-weight:700; }

.tabs-lib { display:flex; gap:8px; padding:0 16px 8px; }
.empty { color:var(--muted); padding:32px 8px; font-size:14px; }

.eps-wrap { display:flex; flex-wrap:wrap; gap:6px; }
.eps-wrap button, .svr-wrap button {
  height:32px; padding:0 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--elevated); font-size:12px; font-weight:600;
}
.eps-wrap button.on, .svr-wrap button.on { background:var(--accent); color:var(--accent-fg); border-color:transparent; }
.player:fullscreen .player-bar,
.player:-webkit-full-screen .player-bar { display:none; }
.player:fullscreen iframe,
.player:-webkit-full-screen iframe { height:100%; }

@media (min-width: 960px) {
  .app { max-width:none; }
  header.top { padding-left: 28px; padding-right: 28px; }
  .brand h1 { font-size: 3rem; }
  .feed { scroll-snap-type: y mandatory; }
  .slide { display:grid; place-items:center; background:var(--bg); }
  .stage {
    position:relative; inset:auto; width:min(1180px, calc(100vw - 48px));
    height: min(78vh, 720px); border-radius: 28px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .slide img.bg, .trailer-slot, .trailer-cover, .veil { position:absolute; inset:0; }
  .meta { left:28px; right:110px; bottom:28px; }
  .meta h2 { font-size: 3rem; }
  .meta p { -webkit-line-clamp:2; max-width: 640px; font-size:15px; }
  .rail { right:22px; bottom:28px; }
  .player { background:#050506; }
  .player iframe { margin: 0 auto; width: min(1280px, 100%); }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const TMDB = "https://api.themoviedb.org/3";
const KEY = "129637a8869a61522af21b80f6eb5129";
const IMG = {
  poster: "https://image.tmdb.org/t/p/w500",
  posterThumb: "https://image.tmdb.org/t/p/w342",
  backdrop: "https://image.tmdb.org/t/p/w780",
  backdropHd: "https://image.tmdb.org/t/p/w1280",
  profile: "https://image.tmdb.org/t/p/w185",
  logo: "https://image.tmdb.org/t/p/w185",
};
const SERVERS = {
  vix: {
    label: "VixSrc",
    movie: id => `https://vixsrc.to/movie/${id}?autoplay=1`,
    tv: (id,s=1,e=1) => `https://vixsrc.to/tv/${id}/${s}/${e}?autoplay=1`,
  },
  videasy: {
    label: "Videasy",
    movie: id => `https://player.videasy.net/movie/${id}?overlay=true`,
    tv: (id,s=1,e=1) => `https://player.videasy.net/tv/${id}/${s}/${e}?episodeSelector=true&nextEpisode=true&overlay=true`,
  },
};
const LANES = [
  {id:"foryou",label:"For You"},
  {id:"movies",label:"Movies"},
  {id:"shows",label:"Shows"},
  {id:"animation",label:"Animation"},
  {id:"action",label:"Action"},
  {id:"comedy",label:"Comedy"},
  {id:"horror",label:"Horror"},
  {id:"saved",label:"Saved"},
  {id:"history",label:"History"},
];
const THEMES = {
  onyx: { name:"Onyx Ivory", bg:"#07070a", surface:"#121216", elevated:"#1c1c22", fg:"#f3f1ec", muted:"#9a9892", accent:"#ece8e0", accentFg:"#0c0c0e" },
  champagne: { name:"Champagne Noir", bg:"#100c08", surface:"#1b1610", elevated:"#2a2218", fg:"#f6ead2", muted:"#b9a687", accent:"#d4af37", accentFg:"#1a1408" },
  amethyst: { name:"Royal Amethyst", bg:"#0c0814", surface:"#171122", elevated:"#241833", fg:"#f0e8ff", muted:"#b3a3c9", accent:"#c9a6ff", accentFg:"#160c24" },
  emerald: { name:"Emerald Vault", bg:"#06110d", surface:"#0d1b16", elevated:"#142821", fg:"#e8f6ef", muted:"#8fb3a4", accent:"#3dd6a0", accentFg:"#042018" },
  blood: { name:"Blood Gold", bg:"#120607", surface:"#1d0d0f", elevated:"#2a1417", fg:"#f8e8e6", muted:"#c49a96", accent:"#e3b04b", accentFg:"#2a1208" },
  arctic: { name:"Arctic Platinum", bg:"#0a0e14", surface:"#121821", elevated:"#1b2430", fg:"#e8eef6", muted:"#93a4b8", accent:"#9fd3ff", accentFg:"#071018" },
};
const LS = {
  prefs: "bwhs-reels-prefs",
  searches: "bwhs-search-recent",
  history: "bwhs-watch-history",
  saved: "bwhs-saved-list",
  theme: "bwhs-theme",
  custom: "bwhs-theme-custom",
};

const $ = (sel, el=document) => el.querySelector(sel);
const mem = new Map();
function cacheGet(k){ const h=mem.get(k); if(!h) return; if(Date.now()-h.at>1000*60*12){mem.delete(k);return} return h.data; }
function cacheSet(k,d){ mem.set(k,{at:Date.now(),data:d}); }
async function tmdb(path, params={}) {
  const u = new URL(TMDB+path);
  u.searchParams.set("api_key", KEY);
  u.searchParams.set("include_adult","false");
  u.searchParams.set("language","en-US");
  Object.entries(params).forEach(([k,v]) => v!=null && u.searchParams.set(k,String(v)));
  const key = u.toString();
  const hit = cacheGet(key); if (hit) return hit;
  const res = await fetch(key);
  if (!res.ok) throw new Error("TMDB "+res.status);
  const data = await res.json();
  cacheSet(key, data);
  return data;
}
function mapItem(it, type) {
  const mediaType = type || (it.media_type==="tv"?"tv":"movie");
  return {
    id: it.id,
    mediaType,
    title: it.title || it.name || "Untitled",
    overview: it.overview || "",
    posterPath: it.poster_path || null,
    backdropPath: it.backdrop_path || null,
    year: (it.release_date || it.first_air_date || "").slice(0,4),
    rating: it.vote_average || 0,
    voteCount: it.vote_count || 0,
    popularity: it.popularity || 0,
    genreIds: it.genre_ids || (it.genres||[]).map(g=>g.id),
    originalLanguage: it.original_language || "",
    trailerKey: null,
    studio: null,
    cast: [],
    runtime: it.runtime || null,
    hydrated: false,
  };
}
function pickTrailer(videos) {
  const list = (videos||[]).filter(v => v.site==="YouTube" && v.key);
  const rank = t => t==="Trailer"?0 : t==="Teaser"?1 : t==="Clip"?2 : 3;
  list.sort((a,b)=> (a.official===b.official?0:a.official?-1:1) || rank(a.type)-rank(b.type));
  return (list[0]||{}).key || null;
}
function ytEmbed(key, muted){
  const p = new URLSearchParams({
    autoplay:"1", mute: muted?"1":"0", controls:"0", rel:"0", modestbranding:"1",
    playsinline:"1", enablejsapi:"1", loop:"1", playlist:key, fs:"0",
    iv_load_policy:"3", disablekb:"1", origin: location.origin
  });
  return `https://www.youtube-nocookie.com/embed/${key}?${p}`;
}
async function findTrailerKey(mediaType, id){
  const base = mediaType==="tv" ? `/tv/${id}` : `/movie/${id}`;
  const tries = [
    tmdb(base+"/videos", { language:"en-US" }),
    tmdb(base+"/videos"),
  ];
  for (const job of tries) {
    try {
      const d = await job;
      const key = pickTrailer(d.results);
      if (key) return key;
    } catch {}
  }
  return null;
}
async function hydrate(reel) {
  if (reel.hydrated && reel.trailerKey) return reel;
  const path = reel.mediaType==="tv" ? `/tv/${reel.id}` : `/movie/${reel.id}`;
  const d = await tmdb(path, { append_to_response: "videos,credits" });
  const companies = d.production_companies || [];
  const networks = d.networks || [];
  const studioSrc = reel.mediaType==="tv" ? (networks[0]||companies[0]) : companies[0];
  let trailerKey = pickTrailer(d.videos && d.videos.results);
  if (!trailerKey) trailerKey = await findTrailerKey(reel.mediaType, reel.id);
  return {
    ...reel,
    overview: d.overview || reel.overview,
    runtime: d.runtime || (d.episode_run_time||[])[0] || reel.runtime,
    trailerKey,
    studio: studioSrc ? { id: studioSrc.id, name: studioSrc.name, logoPath: studioSrc.logo_path||null, kind: networks[0]&&studioSrc===networks[0]?"network":"company" } : null,
    cast: ((d.credits&&d.credits.cast)||[]).slice(0,8).map(c=>({id:c.id,name:c.name,character:c.character||"",profilePath:c.profile_path||null})),
    hydrated: true,
  };
}
async function fetchLane(lane, page=1) {
  if (lane==="saved") return store.saved;
  if (lane==="history") return store.history;
  const common = { page };
  let data;
  if (lane==="movies") data = await tmdb("/discover/movie", {...common, sort_by:"popularity.desc"});
  else if (lane==="shows") data = await tmdb("/discover/tv", {...common, sort_by:"popularity.desc", "without_genres":"10763,10764,10767,10766"});
  else if (lane==="animation") data = await tmdb("/discover/movie", {...common, with_genres:16, sort_by:"popularity.desc"});
  else if (lane==="action") data = await tmdb("/discover/movie", {...common, with_genres:28, sort_by:"popularity.desc"});
  else if (lane==="comedy") data = await tmdb("/trending/all/week", common);
  else if (lane==="horror") data = await tmdb("/discover/movie", {...common, with_genres:27, sort_by:"popularity.desc"});
  else data = await tmdb("/trending/all/day", common);
  const rows = (data.results||[])
    .filter(x => x.media_type!=="person" && (x.poster_path||x.backdrop_path) && !x.adult)
    .map(x => mapItem(x, x.media_type==="tv"?"tv": (lane==="shows"?"tv": (lane==="movies"||lane==="action"||lane==="horror"||lane==="animation"?"movie": (x.title?"movie":"tv")))));
  return rows;
}

function loadJSON(k, fallback) {
  try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; }
}
function saveJSON(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

const store = {
  autoFs: true,
  muted: true,
  searches: loadJSON(LS.searches, []),
  history: loadJSON(LS.history, []),
  saved: loadJSON(LS.saved, []),
  themeId: loadJSON(LS.theme, "onyx"),
  custom: loadJSON(LS.custom, { name:"Custom", bg:"#0b0a08", surface:"#17140f", elevated:"#241e16", fg:"#f4efe6", muted:"#b0a394", accent:"#c9a36a", accentFg:"#140f0a" }),
  hourMode: loadJSON("bwhs-hour-mode", "manual"),
};
try {
  const p = loadJSON(LS.prefs, {});
  if (typeof p.autoFs === "boolean") store.autoFs = p.autoFs;
  if (typeof p.muted === "boolean") store.muted = p.muted;
} catch {}

function persistPrefs(){ saveJSON(LS.prefs,{autoFs:store.autoFs,muted:store.muted}); }
function persistLists(){
  saveJSON(LS.searches, store.searches.slice(0,18));
  saveJSON(LS.history, store.history.slice(0,80));
  saveJSON(LS.saved, store.saved.slice(0,80));
}
function isSaved(reel){ return store.saved.some(x=>x.id===reel.id && x.mediaType===reel.mediaType); }
function toggleSaved(reel){
  if (isSaved(reel)) store.saved = store.saved.filter(x=>!(x.id===reel.id && x.mediaType===reel.mediaType));
  else store.saved = [reel, ...store.saved].slice(0,80);
  persistLists();
}
function addHistory(reel){
  store.history = [reel, ...store.history.filter(x=>!(x.id===reel.id && x.mediaType===reel.mediaType))].slice(0,80);
  persistLists();
}
function addSearch(q){
  const t=q.trim(); if(!t) return;
  store.searches = [t, ...store.searches.filter(x=>x.toLowerCase()!==t.toLowerCase())].slice(0,18);
  persistLists();
}

function applyTheme(id){
  const night = THEMES.onyx, day = THEMES.arctic;
  let t;
  if (id==="auto") {
    const h = new Date().getHours();
    t = (h>=7 && h<19) ? day : night;
    store.themeId = "auto";
  } else if (id==="custom") {
    t = store.custom; store.themeId="custom";
  } else {
    t = THEMES[id] || THEMES.onyx; store.themeId=id;
  }
  const root = document.documentElement;
  root.style.setProperty("--bg", t.bg);
  root.style.setProperty("--surface", t.surface);
  root.style.setProperty("--elevated", t.elevated);
  root.style.setProperty("--fg", t.fg);
  root.style.setProperty("--muted", t.muted);
  root.style.setProperty("--accent", t.accent);
  root.style.setProperty("--accent-fg", t.accentFg);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t.bg);
  saveJSON(LS.theme, store.themeId);
  saveJSON(LS.custom, store.custom);
}

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function ytCommand(func){
  document.querySelectorAll(".trailer-cover iframe").forEach(f=>{
    try { f.contentWindow?.postMessage(JSON.stringify({event:"command",func,args:[]}),"*"); } catch {}
  });
}
function syncTrailers(){
  document.querySelectorAll(".slide").forEach(slide=>{
    const i = +slide.dataset.i;
    const r = state.items[i];
    const slot = slide.querySelector(".trailer-slot");
    if (!slot || !r) return;
    const active = i===state.active && !state.watching && state.overlay==="none";
    const existing = slot.querySelector("iframe");
    if (active && r.trailerKey) {
      if (!existing || existing.dataset.key!==r.trailerKey) {
        slot.innerHTML = `<div class="trailer-cover"><iframe data-key="${r.trailerKey}" src="${ytEmbed(r.trailerKey, store.muted)}" allow="autoplay; encrypted-media; picture-in-picture" title="trailer"></iframe></div>`;
      } else {
        ytCommand("playVideo");
        ytCommand(store.muted?"mute":"unMute");
      }
      const img = slide.querySelector("img.bg");
      if (img && r.backdropPath && !img.src.includes("w1280")) img.src = IMG.backdropHd + r.backdropPath;
    } else if (existing) {
      slot.innerHTML = "";
    }
  });
}
async function enterLandscape(node){
  try { await (node.requestFullscreen || node.webkitRequestFullscreen)?.call(node); } catch {}
  try { await screen.orientation?.lock?.("landscape"); } catch {}
}
async function exitCinemaFs(){
  try { if (document.fullscreenElement) await document.exitFullscreen(); } catch {}
  try { screen.orientation?.unlock?.(); } catch {}
}
function toggleCinemaFs(){
  const el = document.getElementById("cinema");
  if (!el) return;
  if (document.fullscreenElement) exitCinemaFs();
  else enterLandscape(el);
}

function bind(){
  $("#autofs")?.addEventListener("click", ()=>{ store.autoFs=!store.autoFs; persistPrefs(); render(); });
  $("#searchBtn")?.addEventListener("click", ()=>{ state.overlay="search"; render(); $("#q")?.focus(); });
  $("#setBtn")?.addEventListener("click", ()=>{ state.overlay="settings"; render(); });
  $("#libBtn")?.addEventListener("click", ()=>{ state.overlay="library"; state.libTab="saved"; render(); });
  $("#closeOv")?.addEventListener("click", ()=>{ state.overlay="none"; render(); });
  $("#closePlayer")?.addEventListener("click", ()=>{
    state.watching=null;
    exitCinemaFs();
    render();
    requestAnimationFrame(()=>syncTrailers());
  });
  $("#fsPlayer")?.addEventListener("click", ()=>toggleCinemaFs());
  document.querySelectorAll("[data-server]").forEach(b=>b.addEventListener("click", ()=>{
    state.server = b.dataset.server;
    localStorage.setItem("bwhs-server", state.server);
    const frame = document.querySelector("#cinema iframe");
    if (frame && state.watching) frame.src = playSrc(state.watching);
    document.querySelectorAll("[data-server]").forEach(x=>x.classList.toggle("on", x.dataset.server===state.server));
  }));
  document.querySelectorAll("[data-eps]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    openEpisodes(state.items[+b.dataset.eps]);
  }));
  $("#playerEps")?.addEventListener("click", ()=> state.watching && openEpisodes(state.watching));
  $("#closeEps")?.addEventListener("click", ()=>{ state.epPick=null; render(); });
  document.querySelectorAll("[data-season]").forEach(b=>b.addEventListener("click", ()=>{
    state.watchS = +b.dataset.season; state.watchE = 1;
    if (state.epPick) loadEpisodes(state.epPick, state.watchS).then(()=>render());
    else render();
  }));
  document.querySelectorAll("[data-episode]").forEach(b=>b.addEventListener("click", ()=>{
    state.watchE = +b.dataset.episode;
    if (state.epPick) state.epPick.lastSE = {s:state.watchS,e:state.watchE};
    render();
  }));
  $("#playEp")?.addEventListener("click", ()=>{
    const r = state.epPick; state.epPick=null;
    if (r) openWatch(r);
  });
  document.querySelectorAll("[data-lane]").forEach(b=>b.addEventListener("click", ()=>loadLane(b.dataset.lane)));
  document.querySelectorAll("[data-watch]").forEach(b=>b.addEventListener("click", ()=>openWatch(state.items[+b.dataset.watch])));
  document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click", ()=>{
    toggleSaved(state.items[+b.dataset.save]);
    const r=state.items[+b.dataset.save];
    b.classList.toggle("saved", isSaved(r));
    b.querySelector("span").textContent = isSaved(r)?"Saved":"Save";
  }));
  document.querySelectorAll("[data-mute]").forEach(b=>b.addEventListener("click", ()=>{
    store.muted=!store.muted; persistPrefs();
    document.querySelectorAll("[data-mute]").forEach(btn=>{
      btn.querySelector("i").innerHTML = store.muted?icon("mute"):icon("vol");
      btn.querySelector("span").textContent = store.muted?"Muted":"Sound";
    });
    ytCommand(store.muted?"mute":"unMute");
  }));
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click", ()=>{ state.synopsis=state.items[+b.dataset.open]; state.overlay="synopsis"; render(); }));
  document.querySelectorAll("[data-open-title]").forEach(b=>b.addEventListener("click", ()=>{
    const reel = JSON.parse(b.getAttribute("data-open-title"));
    state.overlay="none";
    openWatch(reel);
  }));
  document.querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click", ()=>openPerson(JSON.parse(b.getAttribute("data-person")))));
  document.querySelectorAll("[data-studio]").forEach(b=>b.addEventListener("click", ()=>{
    const s = JSON.parse(b.getAttribute("data-studio")); if(s&&s.id) openStudio(s);
  }));
  document.querySelectorAll("[data-theme]").forEach(b=>b.addEventListener("click", ()=>{ applyTheme(b.dataset.theme); render(); }));
  document.querySelectorAll("[data-lib]").forEach(b=>b.addEventListener("click", ()=>{ state.libTab=b.dataset.lib; render(); }));
  document.querySelectorAll("[data-recent]").forEach(b=>b.addEventListener("click", ()=>{ state.searchQ=b.dataset.recent; runSearch(state.searchQ); }));
  $("#clearSearches")?.addEventListener("click", ()=>{ store.searches=[]; persistLists(); render(); });
  $("#synWatch")?.addEventListener("click", ()=>openWatch(state.synopsis));
  document.querySelectorAll("[data-ckey]").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const k=e.target.dataset.ckey;
      store.custom[k]=e.target.value;
      applyTheme("custom");
      render();
    });
  });
  document.querySelectorAll("[data-tkey]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const v=e.target.value.trim();
      if(!/^#([0-9a-fA-F]{6})$/.test(v)) return;
      store.custom[e.target.dataset.tkey]=v.toLowerCase();
      applyTheme("custom");
      render();
    });
  });
  const q = $("#q");
  if (q){
    q.addEventListener("input", e=>{
      state.searchQ=e.target.value;
      clearTimeout(window.__qs);
      window.__qs=setTimeout(()=>runSearch(state.searchQ), 180);
    });
    q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ addSearch(state.searchQ); persistLists(); }});
  }
  const feed = $("#feed");
  if (feed){
    feed.addEventListener("scroll", onScroll, {passive:true});
    if (state.restoreY) feed.scrollTop = state.restoreY;
  }
  requestAnimationFrame(()=>syncTrailers());
}

function restoreScroll(){
  const feed=$("#feed"); if(feed && state.restoreY) feed.scrollTop=state.restoreY;
}

function onScroll(e){
  const el=e.target;
  state.restoreY=el.scrollTop;
  const i = Math.round(el.scrollTop / el.clientHeight);
  if (i!==state.active && state.items[i]) {
    state.active=i;
    document.querySelectorAll(".slide").forEach((s,idx)=>s.classList.toggle("active", idx===i));
    syncTrailers();
    hydrateAround(i);
    if (i > state.items.length-4) loadMore();
  }
}

async function hydrateAround(i){
  const start = Math.max(0,i-1);
  const slice = state.items.slice(start, i+4);
  await Promise.all(slice.map(async (item, idx)=>{
    const pos = start+idx;
    const real = state.items[pos];
    if (!real || (real.hydrated && real.trailerKey)) return;
    try {
      const next = await hydrate(real);
      state.items[pos]=next;
      const slide = document.querySelector(`.slide[data-i="${pos}"]`);
      if (slide && next.cast?.length) {
        const row = slide.querySelector(".cast-row");
        if (row) row.innerHTML = next.cast.slice(0,6).map(p=>`<button class="cast" data-person='${escAttr(JSON.stringify(p))}'>
          ${p.profilePath?`<img src="${IMG.profile+p.profilePath}" alt="">`:`<span class="ph">${esc(p.name[0]||"?")}</span>`}
          <span>${esc(p.name)}</span>
        </button>`).join("");
        row.querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click", ()=>openPerson(JSON.parse(b.getAttribute("data-person")))));
      }
      if (slide && next.studio) {
        const st = slide.querySelector(".studio");
        if (st) {
          st.disabled = false;
          st.setAttribute("data-studio", JSON.stringify(next.studio));
          st.querySelector("small").textContent = next.studio.name;
        }
      }
    } catch { if (real) real.hydrated=true; }
  }));
  syncTrailers();
}

async function loadLane(id){
  state.lane=id; state.boot=true; state.page=1; state.active=0; state.overlay="none"; state.items=[];
  render();
  try {
    state.items = await fetchLane(id,1);
  } catch(e){ state.items=[]; }
  state.boot=false;
  render();
  hydrateAround(0);
}

async function loadMore(){
  if (state.lane==="saved"||state.lane==="history"||state._more) return;
  state._more=true;
  try {
    const next = await fetchLane(state.lane, state.page+1);
    state.page+=1;
    const seen = new Set(state.items.map(x=>x.mediaType+x.id));
    state.items = state.items.concat(next.filter(x=>!seen.has(x.mediaType+x.id)));
  } catch {}
  state._more=false;
}

async function runSearch(q){
  const t=q.trim();
  state.searchQ=q;
  if(!t){ state.searchTitles=[]; state.searchPeople=[]; render(); return; }
  state.searchBusy=true; render();
  try {
    const [media, people] = await Promise.all([
      tmdb("/search/multi",{query:t}),
      tmdb("/search/person",{query:t}),
    ]);
    state.searchTitles = (media.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv").map(x=>mapItem(x,x.media_type));
    state.searchPeople = (people.results||[]).slice(0,12).map(p=>({id:p.id,name:p.name,profilePath:p.profile_path||null}));
    addSearch(t);
  } catch { state.searchTitles=[]; state.searchPeople=[]; }
  state.searchBusy=false; render();
  const inp=$("#q"); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}

function openWatch(reel){
  if(!reel) return;
  addHistory(reel);
  state.watching=reel; state.overlay="none"; state.epPick=null;
  if (reel.mediaType==="tv") {
    if (reel.lastSE) { state.watchS=reel.lastSE.s; state.watchE=reel.lastSE.e; }
    loadSeasons(reel);
  }
  render();
  const cinema = document.getElementById("cinema");
  if (isPhone() && cinema) enterLandscape(cinema);
}
async function loadSeasons(reel){
  const key="tv-"+reel.id;
  if (state.seasons[key]) return state.seasons[key];
  try {
    const d = await tmdb(`/tv/${reel.id}`);
    state.seasons[key] = (d.seasons||[]).filter(s=>s.season_number>0 && s.episode_count>0)
      .map(s=>({n:s.season_number, count:s.episode_count, name:s.name}));
    if (!state.watchS) state.watchS = state.seasons[key][0]?.n || 1;
    await loadEpisodes(reel, state.watchS);
  } catch { state.seasons[key]=[]; }
  return state.seasons[key];
}
async function loadEpisodes(reel, season){
  const key="tv-"+reel.id+"-"+season;
  if (state.episodes[key]) return state.episodes[key];
  try {
    const d = await tmdb(`/tv/${reel.id}/season/${season}`);
    state.episodes[key] = (d.episodes||[]).map(e=>({n:e.episode_number, name:e.name||""}));
  } catch { state.episodes[key]=[]; }
  return state.episodes[key];
}
async function openEpisodes(reel){
  if (!reel || reel.mediaType!=="tv") return;
  state.epPick = reel;
  if (reel.lastSE) { state.watchS=reel.lastSE.s; state.watchE=reel.lastSE.e; }
  render();
  await loadSeasons(reel);
  await loadEpisodes(reel, state.watchS);
  render();
}

async function openPerson(p){
  state.overlay="person";
  state.catalog={title:p.name, items:[]};
  render();
  try {
    const d = await tmdb(`/person/${p.id}/combined_credits`);
    state.catalog.items = (d.cast||[]).filter(x=>x.poster_path).slice(0,40).map(x=>mapItem(x, x.media_type==="tv"?"tv":"movie"));
  } catch {}
  render();
}
async function openStudio(s){
  state.overlay="studio";
  state.catalog={title:s.name, items:[]};
  render();
  try {
    const path = s.kind==="network" ? "/discover/tv" : "/discover/movie";
    const key = s.kind==="network" ? "with_networks" : "with_companies";
    const d = await tmdb(path, {[key]:s.id, sort_by:"popularity.desc"});
    state.catalog.items = (d.results||[]).map(x=>mapItem(x, s.kind==="network"?"tv":"movie"));
  } catch {}
  render();
}

applyTheme(store.themeId);
if (store.themeId==="auto") setInterval(()=>applyTheme("auto"), 10*60*1000);
render();
loadLane("foryou");
</script>
</body>
</html>
