name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python imaging
        run: pip install pillow

      - name: Make app icon
        run: python3 tools/make_icon.py

      - name: Install Dependencies
        run: npm install

      - name: Build Assets & Add Android
        run: |
          npm run build
          npx cap add android
          python3 tools/patch_android.py
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BWHS-Reels.apk

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c 'import json;print(json.load(open(\"version.json\"))[\"version\"])')" >> $GITHUB_OUTPUT

      - name: Publish installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BWHS Reels ${{ steps.ver.outputs.version }}
          files: BWHS-Reels.apk
          generate_release_notes: true
          make_latest: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BWHS-Reels-APK
          path: BWHS-Reels.apk
